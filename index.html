<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sabai">
<meta name="theme-color" content="#0F1012">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-512.png">

<body>
<title>Sabai English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone app, dark graphite "recording studio". Header with day + streak, one scrolling column of flat cards, 4-tab bar at the thumb. Sora for text, JetBrains Mono for labels and numbers, amber for the one action that matters. */
:root{
  --bg:#0F1012; --card:#17181B; --card2:#1F2024; --line:#26272B; --fg:#F2F2F0; --muted:#8E9097; --dim:#6E7076; --ink:#0F1012;
  --amber:#F0B35B; --amber-d:#C58F3E; --amber-soft:#2A2318; --green:#5CC08C; --green-soft:#16281E; --red:#E5636E; --red-soft:#2E1A1D;
  --display:'Sora',-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F4F2; --card:#FFFFFF; --card2:#EEEEEA; --line:#E0E0DB; --fg:#151515; --muted:#67696F; --dim:#8A8C92; --ink:#0F1012;
    --amber:#D99A3C; --amber-d:#B57C26; --amber-soft:#FBF0DC; --green:#2E8B5A; --green-soft:#E1F3E8; --red:#C84B57; --red-soft:#F9E3E5;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F4F4F2; --card:#FFFFFF; --card2:#EEEEEA; --line:#E0E0DB; --fg:#151515; --muted:#67696F; --dim:#8A8C92; --ink:#0F1012;
  --amber:#D99A3C; --amber-d:#B57C26; --amber-soft:#FBF0DC; --green:#2E8B5A; --green-soft:#E1F3E8; --red:#C84B57; --red-soft:#F9E3E5;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 8px;gap:10px}
.top .l{display:flex;flex-direction:column;gap:2px;min-width:0}
.top .l .mono{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mono{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.brand{font-size:20px;font-weight:600;letter-spacing:-.01em}
.streak{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;white-space:nowrap;border-radius:8px;background:var(--card);border:1px solid var(--line);font-family:var(--mono);font-size:13px;font-weight:600;color:var(--muted)}
.streak i{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
.streak.on{color:var(--amber)}.streak.on i{background:var(--amber)}
.iconbtn{width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--line);background:var(--card)}
.iconbtn svg{width:20px;height:20px}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 20px 28px}
main > *{min-width:0}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--bg);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:10px;color:var(--muted);font-size:11px;font-weight:500;min-height:52px;justify-content:center}
.tab svg{width:22px;height:22px}
.tab.active{color:var(--amber)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.soft{background:var(--card2)}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.head .mono.acc{color:var(--amber)}
.h1{font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.h2{font-size:17px;font-weight:600}
.lead{font-size:19px;line-height:1.35;font-weight:500}
.en{font-size:23px;line-height:1.3;font-weight:600;letter-spacing:-.005em;text-wrap:balance}
.en .gapword{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--amber);color:transparent;line-height:1}
.en .hit{background:var(--amber-soft);color:var(--amber);border-radius:6px;padding:0 5px}
.fr{font-size:16px;color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);line-height:1.5}
.say{font-size:14.5px;background:var(--card2);border-radius:12px;padding:10px 12px}
.say .lbl,.tip .lbl{display:block;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
.tip{font-size:14.5px;border-left:2px solid var(--amber);padding:2px 0 2px 12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 18px;border-radius:12px;font-weight:600;font-size:16px;width:100%;background:var(--card2);color:var(--fg);border:1px solid var(--line);transition:transform .06s,opacity .1s}
.btn:active{transform:scale(.985);opacity:.9}
.btn.amber{background:var(--amber);color:var(--ink);border-color:transparent}
.btn.green{background:var(--green-soft);color:var(--green);border-color:transparent}
.btn.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.btn.line{background:transparent}
.btn.small{min-height:40px;font-size:14px;width:auto;padding:0 14px;font-weight:500}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:20px;height:20px;flex:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.playrow{display:flex;align-items:center;gap:10px}
.play{width:56px;height:56px;border-radius:50%;background:var(--amber);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.play svg{width:24px;height:24px;margin-left:3px}
.bars{display:none;align-items:flex-end;gap:3px;height:22px}
.bars i{display:block;width:4px;background:currentColor;border-radius:2px;animation:bar .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}
.play.playing .bars{display:flex}.play.playing .tri{display:none}
@keyframes bar{0%,100%{height:6px}50%{height:20px}}
@media (prefers-reduced-motion:reduce){.bars i{animation:none;height:12px}}
.speedrow{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.speedrow .btn{width:auto;min-height:40px;font-size:13.5px;padding:0 12px;font-weight:500;flex:1}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:52px;border-radius:12px;font-size:18px;font-weight:500;display:flex;align-items:center;justify-content:center;padding:8px 14px;background:var(--card2);border:1px solid var(--line);text-align:center;line-height:1.25}
.opt.right{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.opt.wrong{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.opt[disabled]{opacity:.45;pointer-events:none}
.opt.right[disabled],.opt.wrong[disabled]{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipw{min-height:42px;padding:0 13px;border-radius:10px;font-size:16px;font-weight:500;background:var(--card2);border:1px solid var(--line)}
.chipw.on{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.answer{min-height:60px;border:1px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.answer.ok{border-style:solid;border-color:var(--green);background:var(--green-soft)}
.answer.ko{border-style:solid;border-color:var(--red);background:var(--red-soft)}
.answer:empty::before{content:"Tape les mots dans l'ordre";color:var(--muted);font-size:14px;padding-left:6px}
.verdict{font-weight:600;font-size:16px}
.verdict.ok{color:var(--green)}.verdict.ko{color:var(--red)}
.progress{display:flex;gap:4px;margin:4px 0 10px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--card2)}
.progress i.done{background:var(--amber)}
.progress i.cur{background:var(--amber);opacity:.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.stat b{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1}
.stat b small{font-size:12px;color:var(--green)}
.stat span{font-size:11px;color:var(--muted)}
.cando{display:flex;flex-direction:column;gap:10px}
.cando .it{display:flex;align-items:center;gap:12px;font-size:14.5px;text-align:left;width:100%}
.cando .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:none;display:inline-flex;align-items:center;justify-content:center}
.cando .it.done .box{background:var(--green);border-color:var(--green);color:var(--ink)}
.cando .it.wip{color:var(--amber);font-weight:600}.cando .it.wip .box{border:2px solid var(--amber)}
.cando .it.todo{color:var(--dim)}
.cando .box svg{width:12px;height:12px}
.barsrow{display:flex;align-items:flex-end;gap:8px;height:56px}
.barsrow i{flex:1;border-radius:4px 4px 0 0;background:var(--card2);display:block;min-height:3px}
.barsrow i.last{background:var(--amber)}
.axis{display:flex;gap:8px}
.axis span{flex:1;font-family:var(--mono);font-size:10px;color:var(--dim);text-align:center}
textarea,select,input[type=text]{width:100%;font:inherit;color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:52px}
textarea{min-height:120px;resize:vertical;font-size:17px;line-height:1.45}
select{appearance:none;-webkit-appearance:none}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.item.flat{background:none;border:0;padding:6px 0}
.item .txt{flex:1;min-width:0}
.item .w{font-size:16px;font-weight:600}
.item .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub.wrap{white-space:normal}
.item .mini{width:42px;height:42px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--fg)}
.item .mini svg{width:18px;height:18px}
.item .mini.acc{background:var(--amber);color:var(--ink);border-color:transparent}
.badge{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--card2);color:var(--muted);flex:none}
.badge.due{background:var(--amber-soft);color:var(--amber)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chipw{flex:none;font-size:14px;min-height:36px}
.empty{color:var(--muted);font-size:14.5px;text-align:center;padding:14px 8px;line-height:1.5}
.gap{display:flex;flex-direction:column;gap:4px;padding:10px 12px;background:var(--card2);border-radius:12px}
.gap .said{font-size:13px;color:var(--red);text-decoration:line-through}
.gap .better{font-size:18px;font-weight:600}
.gap .why{font-size:13px;color:var(--muted)}
.needs-claude{display:none}.has-claude .needs-claude{display:flex}
.no-claude{display:block}.has-claude .no-claude{display:none}
.has-claude .needs-claude.block{display:block}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--bg);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{flex:1;min-height:38px;border-radius:8px;font-weight:500;font-size:14px}
.seg button.on{background:var(--amber);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:20;max-width:90%;text-align:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--card2);color:var(--muted)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.green{background:var(--green-soft);color:var(--green)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;text-align:left;min-height:84px}
.theme b{font-size:14.5px;font-weight:600}
.theme span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.theme .pb{height:3px;border-radius:2px;background:var(--card2);overflow:hidden;margin-top:4px}
.theme .pb i{display:block;height:100%;background:var(--amber)}
.hint{display:flex;flex-wrap:wrap;gap:6px}
.hint span{font-family:var(--mono);font-size:12px;padding:5px 8px;border-radius:6px;background:var(--card2);color:var(--fg)}
</style>

<div id="app">
  <header class="top">
    <div class="l"><span class="mono" id="dateLine">Jour 1</span><span class="brand">Sabai</span></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="streak" id="streakChip" data-action="open-settings" aria-label="Série"><i></i><span id="streakN">0 jours</span></button>
      <button class="iconbtn" data-action="open-settings" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="tabs" aria-label="Onglets">
    <button class="tab active" data-tab="parle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>Parler</button>
    <button class="tab" data-tab="ecoute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Écouter</button>
    <button class="tab" data-tab="mots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Mots</button>
    <button class="tab" data-tab="progres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-8M22 19H2"/></svg>Progrès</button>
  </nav>
</div>
<div id="overlay"></div>

<script>
/*DATA-START*/
const SITS = [
{id:'seven',title:'Au 7-Eleven',ctx:"Le caissier te parle. C'est court, rapide, et toujours les mêmes phrases.",lines:[
 {en:"Do you want a bag?",fr:"Tu veux un sac ?",tip:"« Do you » se dit très vite, ça sonne « dju ». Tu n'entends presque que « want a bag ? ».",gap:"bag",alts:["back","bank"]},
 {en:"Would you like it heated up?",fr:"Tu veux que je le réchauffe ?",tip:"« heated up » : le « t » entre deux voyelles sonne presque « d », donc « heeded up ».",gap:"heated",alts:["hated","headed"]},
 {en:"That's sixty-five baht.",fr:"Ça fait 65 bahts.",tip:"Le « s » de « That's » se colle au chiffre. Concentre-toi sur le chiffre, le reste est du bruit.",gap:"sixty-five",alts:["sixteen","seventy-five"]},
 {en:"Do you have a points card?",fr:"Tu as une carte de points ?",tip:"« Do you have » devient « dju hav ». Le mot clé c'est « points card ».",gap:"points",alts:["pints","prints"]},
 {en:"Sorry, we don't have any smaller change.",fr:"Désolé, on n'a pas de plus petite monnaie.",tip:"« don't have any » se dit en un bloc : « donthavenny ». « change » = la monnaie.",gap:"change",alts:["chance","charge"]},
 {en:"Receipt in the bag?",fr:"Le ticket dans le sac ?",tip:"Phrase ultra courte, sans verbe. Les Thaïs coupent les phrases : « Receipt ? » suffit.",gap:"Receipt",alts:["Reset","Recipe"]}
]},
{id:'grab',title:'Taxi et Grab',ctx:"Le chauffeur te parle, souvent avec la musique et le bruit de la route.",lines:[
 {en:"Where are you going?",say:"Where ya going?",fr:"Tu vas où ?",tip:"« are you » disparaît presque : « where-ya-goin ».",gap:"going",alts:["growing","doing"]},
 {en:"Can you turn the meter on, please?",fr:"Tu peux mettre le compteur, s'il te plaît ?",tip:"« meter » = compteur. C'est toi qui le dis en montant.",gap:"meter",alts:["mirror","motor"]},
 {en:"It's going to take about twenty minutes with the traffic.",say:"It's gonna take about twenty minutes with the traffic.",fr:"Ça va prendre environ vingt minutes avec les bouchons.",tip:"« going to » devient « gonna ». Tu l'entendras cent fois par jour.",gap:"twenty",alts:["thirty","seventy"]},
 {en:"Just drop me off here, thanks.",fr:"Dépose-moi juste ici, merci.",tip:"« drop me off » : les trois mots se collent, « dropmioff ».",gap:"drop",alts:["drive","stop"]},
 {en:"Do you have change for a thousand?",fr:"Tu as la monnaie sur mille ?",tip:"« a thousand » : le « d » final s'entend à peine, « a thousan ».",gap:"thousand",alts:["hundred","dozen"]},
 {en:"Turn left at the next light.",fr:"Tourne à gauche au prochain feu.",tip:"« at the » devient « a-the ». « light » ici = le feu rouge, pas la lumière.",gap:"left",alts:["lift","right"]}
]},
{id:'food',title:'Street food et resto',ctx:"Commander, demander, payer. Les phrases sont courtes et vont vite.",lines:[
 {en:"Spicy or not spicy?",fr:"Épicé ou pas épicé ?",tip:"Question typique ici, sans verbe. Réponds « a little bit » si tu veux pas pleurer.",gap:"Spicy",alts:["Spacey","Speedy"]},
 {en:"Do you want it to go?",fr:"C'est à emporter ?",tip:"« to go » = à emporter. « want it to » se dit « wannit-tuh ».",gap:"go",alts:["grow","gold"]},
 {en:"What would you like to drink?",say:"What would ya like to drink?",fr:"Qu'est-ce que tu veux boire ?",tip:"« would you » devient « wouldja ». Le mot clé : « drink ».",gap:"drink",alts:["think","bring"]},
 {en:"Can I get the bill, please?",fr:"Je peux avoir l'addition ?",tip:"C'est TOI qui le dis. « Can I get » sonne « kenaiget ». « bill » = l'addition.",gap:"bill",alts:["bell","beer"]},
 {en:"Is this one pork or chicken?",fr:"Celui-là c'est du porc ou du poulet ?",tip:"« this one » devient « thiswun ». « or » est très court, presque « er ».",gap:"pork",alts:["park","port"]},
 {en:"A little bit spicy, please.",fr:"Un peu épicé, s'il vous plaît.",tip:"« little bit » devient « lil-bit ». Phrase à connaître par cœur.",gap:"little",alts:["letter","later"]}
]},
{id:'hotel',title:'Hôtel et condo',ctx:"La réception, le ménage, les petits problèmes de chambre.",lines:[
 {en:"Have you got a reservation?",say:"Have ya got a reservation?",fr:"Vous avez une réservation ?",tip:"« Have you got » = « Do you have » version anglaise. « got a » sonne « godda ».",gap:"reservation",alts:["conversation","preservation"]},
 {en:"Checkout is at twelve.",say:"Checkout's at twelve.",fr:"Le départ est à midi.",tip:"« is at » se compresse en « zat ». Écoute surtout l'heure.",gap:"twelve",alts:["twenty","shelf"]},
 {en:"The wifi password is on the card.",say:"The wifi password's on the card.",fr:"Le mot de passe wifi est sur la carte.",tip:"Le « s » de « password's » se colle à « on » : « passwordzon ».",gap:"password",alts:["passport","passing"]},
 {en:"Could I get an extra towel?",fr:"Je pourrais avoir une serviette en plus ?",tip:"« Could I » sonne « coudai ». « towel » se prononce « taol ».",gap:"towel",alts:["tower","table"]},
 {en:"There's no hot water in my room.",fr:"Il n'y a pas d'eau chaude dans ma chambre.",tip:"« There's no » devient « thezno ». « water » sonne « wodder » en accent américain.",gap:"water",alts:["waiter","wander"]},
 {en:"Which floor is the pool on?",fr:"La piscine est à quel étage ?",tip:"« floor » = étage. Le petit « on » à la fin est important.",gap:"floor",alts:["flower","four"]}
]},
{id:'massage',title:'Massage',ctx:"Avant, pendant, après. Tu dois surtout savoir dire « plus doux ».",lines:[
 {en:"What kind of massage would you like?",say:"What kinda massage would ya like?",fr:"Quel type de massage tu veux ?",tip:"« kind of » devient « kinda ». Thai, oil, foot : réponds en un mot.",gap:"kind",alts:["kid","kite"]},
 {en:"One hour or two hours?",fr:"Une heure ou deux heures ?",tip:"« hour » : le « h » ne se prononce pas, ça fait « aour ».",gap:"hour",alts:["are","flower"]},
 {en:"Is the pressure okay?",fr:"La pression, ça va ?",tip:"« pressure » sonne « preshur ». Réponds « softer » ou « harder ».",gap:"pressure",alts:["pleasure","pressing"]},
 {en:"Tell me if it hurts.",fr:"Dis-moi si ça fait mal.",tip:"« if it » devient « ifit ». « hurts » = ça fait mal.",gap:"hurts",alts:["hearts","hats"]},
 {en:"Could you go a bit softer?",fr:"Vous pouvez y aller plus doucement ?",tip:"« a bit » devient « abit ». C'est toi qui le dis quand ça fait trop mal.",gap:"softer",alts:["after","sofa"]},
 {en:"Lie down on your back, please.",fr:"Allongez-vous sur le dos.",tip:"« lie down » = s'allonger. « on your back » sonne « on-yer-back ».",gap:"back",alts:["bag","black"]}
]},
{id:'market',title:'Marché et shopping',ctx:"Demander le prix, négocier un peu, dire non gentiment.",lines:[
 {en:"How much is this?",fr:"C'est combien ?",tip:"« How much » devient « hamuch ». Toujours la même mélodie.",gap:"much",alts:["match","mush"]},
 {en:"Can you do a better price?",fr:"Tu peux faire un meilleur prix ?",tip:"« do a » devient « dua ». « better » sonne « bedder » en accent américain.",gap:"better",alts:["butter","bitter"]},
 {en:"That's my best price.",fr:"C'est mon dernier prix.",tip:"« That's my » devient « thatsmai ». Quand tu entends ça, la négo est presque finie.",gap:"best",alts:["vest","bus"]},
 {en:"Do you have it in a bigger size?",fr:"Vous l'avez en plus grand ?",tip:"« have it in a » : quatre mots en un, « havidina ».",gap:"bigger",alts:["beggar","big"]},
 {en:"I'll take two.",fr:"J'en prends deux.",tip:"« I'll » sonne « ail ». « take » = je prends, j'achète.",gap:"take",alts:["talk","tick"]},
 {en:"Just looking, thanks.",fr:"Je regarde juste, merci.",tip:"Ta phrase magique pour qu'on te laisse tranquille.",gap:"looking",alts:["locking","liking"]}
]},
{id:'people',title:'Rencontrer des gens',ctx:"Les cinq questions que tout le monde te pose. Apprends-les, tu les reconnaîtras direct.",lines:[
 {en:"Where are you from?",say:"Where ya from?",fr:"Tu viens d'où ?",tip:"« are you » devient « ya ». Réponds « France » et renvoie la question.",gap:"from",alts:["form","front"]},
 {en:"How long have you been in Thailand?",say:"How long have ya been in Thailand?",fr:"Ça fait combien de temps que t'es en Thaïlande ?",tip:"« have you been » devient « havyabin ». C'est LA question numéro un.",gap:"been",alts:["bean","being"]},
 {en:"What do you do for work?",say:"What do ya do for work?",fr:"Tu fais quoi comme boulot ?",tip:"« What do you do » devient « whaddaya do ». Réponds simple : « I run a business ».",gap:"work",alts:["walk","word"]},
 {en:"How long are you staying?",fr:"Tu restes combien de temps ?",tip:"« are you » devient « ya » encore. « staying » = rester.",gap:"staying",alts:["standing","saying"]},
 {en:"Nice to meet you, I'm Marvin.",say:"Nice to meetcha, I'm Marvin.",fr:"Enchanté, moi c'est Marvin.",tip:"« meet you » devient « meetcha ». Ta phrase, à dire avec le sourire.",gap:"meet",alts:["meat","mate"]},
 {en:"Do you want to grab a drink later?",say:"Wanna grab a drink later?",fr:"On va boire un verre plus tard ?",tip:"« Do you want to » devient « wanna ». « grab a drink » = boire un verre.",gap:"later",alts:["letter","ladder"]}
]},
{id:'visa',title:'Immigration et visa',ctx:"Bureau froid, questions sèches. Réponses courtes, pas de blabla.",lines:[
 {en:"What's the purpose of your visit?",fr:"Quel est le but de votre visite ?",tip:"Réponse : « tourism » ou « holiday ». Pas plus.",gap:"purpose",alts:["porpoise","propose"]},
 {en:"How long are you planning to stay?",fr:"Vous comptez rester combien de temps ?",tip:"« planning to » devient « planninta ». Donne un nombre de jours ou de mois.",gap:"planning",alts:["planting","playing"]},
 {en:"Please fill in this form.",fr:"Veuillez remplir ce formulaire.",tip:"« fill in » = remplir. « form » = formulaire, pas « forme ».",gap:"form",alts:["farm","from"]},
 {en:"I need a copy of your passport.",fr:"J'ai besoin d'une copie de votre passeport.",tip:"« copy of your » devient « copyavyer ». Aie toujours une copie sur toi.",gap:"copy",alts:["coffee","cup"]},
 {en:"Come back in two weeks.",fr:"Revenez dans deux semaines.",tip:"« in two weeks » = dans deux semaines. « weeks » sonne comme « weak » mais c'est pas pareil.",gap:"weeks",alts:["weak","wicks"]},
 {en:"Your visa expires on the fifteenth.",fr:"Votre visa expire le quinze.",tip:"« fifteenth » (15) et « fiftieth » (50) : écoute le « n » du milieu.",gap:"fifteenth",alts:["fiftieth","fifth"]}
]},
{id:'cafe',title:'Café et coworking',ctx:"Commander un café, trouver une place, demander le wifi.",lines:[
 {en:"Can I get a flat white, please?",fr:"Un flat white, s'il vous plaît.",tip:"« Can I get » sonne « kenaiget ». Ta phrase pour commander n'importe quoi.",gap:"flat",alts:["flag","float"]},
 {en:"Is this seat taken?",fr:"Cette place est prise ?",tip:"« seat » (siège, « i » long) et « sit » (s'asseoir, « i » court).",gap:"seat",alts:["sit","sheet"]},
 {en:"What's the wifi password?",fr:"C'est quoi le mot de passe wifi ?",tip:"« What's the » devient « whatsthe ». Tout le monde la dit, tu la reconnais déjà.",gap:"wifi",alts:["why","wife"]},
 {en:"Could you watch my stuff for a sec?",fr:"Tu peux surveiller mes affaires deux secondes ?",tip:"« watch my stuff » = surveiller mes affaires. « a sec » = a second.",gap:"stuff",alts:["staff","stop"]},
 {en:"Do you mind if I sit here?",say:"Do ya mind if I sit here?",fr:"Ça te dérange si je m'assois ici ?",tip:"« Do you mind » = ça te dérange ? Réponds « No, go ahead » (= vas-y).",gap:"mind",alts:["mine","mend"]},
 {en:"Are you working remotely too?",fr:"Tu bosses à distance aussi ?",tip:"« remotely » sonne « rimoutli ». « too » à la fin = aussi.",gap:"remotely",alts:["remote","recently"]}
]},
{id:'pharma',title:'Pharmacie et santé',ctx:"Expliquer ce qui ne va pas et comprendre la posologie.",lines:[
 {en:"What are your symptoms?",say:"What're your symptoms?",fr:"Quels sont vos symptômes ?",tip:"« What are » devient « whadder ». Prépare 2-3 mots : headache, fever, stomach.",gap:"symptoms",alts:["systems","symbols"]},
 {en:"Take one after meals.",fr:"Prenez-en un après les repas.",tip:"« meals » = repas. « after » sonne « afta ».",gap:"meals",alts:["miles","males"]},
 {en:"Do you have something for a sore throat?",fr:"Vous avez quelque chose pour le mal de gorge ?",tip:"« sore throat » = mal de gorge. « something for » devient « sumthinfer ».",gap:"throat",alts:["thought","threat"]},
 {en:"Are you allergic to anything?",fr:"Vous êtes allergique à quelque chose ?",tip:"« allergic to » devient « alerjictu ». Réponds « No » ou le nom du médicament.",gap:"allergic",alts:["energetic","electric"]},
 {en:"Twice a day for five days.",fr:"Deux fois par jour pendant cinq jours.",tip:"« twice » = deux fois. « a day » devient « aday » = par jour.",gap:"Twice",alts:["Twist","Twins"]},
 {en:"You should see a doctor if it gets worse.",fr:"Vous devriez voir un médecin si ça empire.",tip:"« gets worse » = ça empire. « should » sonne « shud ».",gap:"worse",alts:["worst","was"]}
]},
{id:'scooter',title:'Location de scooter',ctx:"Le loueur parle vite et veut ton passeport. Prends des photos avant.",lines:[
 {en:"I need your passport as a deposit.",fr:"J'ai besoin de votre passeport comme caution.",tip:"« as a deposit » devient « azadeposit ». Deposit = caution. Évite de laisser le vrai.",gap:"deposit",alts:["deputy","opposite"]},
 {en:"Have you ridden a scooter before?",fr:"Vous avez déjà conduit un scooter ?",tip:"« ridden » = conduit (vélo, moto). « before » à la fin = déjà.",gap:"ridden",alts:["written","hidden"]},
 {en:"Bring it back with a full tank.",fr:"Ramenez-le avec le plein.",tip:"« bring it back » devient « bringitback ». « full tank » = le plein.",gap:"tank",alts:["thank","tent"]},
 {en:"It's two hundred and fifty a day.",fr:"C'est 250 par jour.",tip:"« two hundred and fifty » devient « two-hundren-fifty ». « a day » = par jour.",gap:"fifty",alts:["fifteen","sixty"]},
 {en:"Make sure you wear a helmet.",fr:"Mettez bien un casque.",tip:"« Make sure » = assure-toi. « wear a » devient « wera ».",gap:"helmet",alts:["hammer","hamlet"]},
 {en:"Any scratches, you pay.",fr:"S'il y a des rayures, vous payez.",tip:"Phrase coupée, style thaï. « scratches » = rayures.",gap:"scratches",alts:["sketches","snatches"]}
]},
{id:'money',title:'Téléphone, carte et argent',ctx:"SIM, distributeur, paiement. Les chiffres vont vite.",lines:[
 {en:"Do you want a tourist SIM?",fr:"Vous voulez une SIM touriste ?",tip:"« tourist » sonne « turist ». « SIM » se dit comme en français.",gap:"tourist",alts:["tourism","torrent"]},
 {en:"How many gigs do you need?",fr:"Il vous faut combien de gigas ?",tip:"« gigs » = gigas (GB). « do you need » devient « dyaneed ».",gap:"gigs",alts:["gifts","kegs"]},
 {en:"The machine only takes cash.",fr:"La machine ne prend que du liquide.",tip:"« only takes » devient « onlytakes ». « cash » = espèces.",gap:"cash",alts:["catch","crash"]},
 {en:"Your card has been declined.",say:"Your card's been declined.",fr:"Votre carte a été refusée.",tip:"« declined » = refusée. Pas de panique, essaie une autre carte.",gap:"declined",alts:["defined","designed"]},
 {en:"Can I pay by card?",fr:"Je peux payer par carte ?",tip:"« pay by » devient « paybai ». Réponse fréquente : « Cash only ».",gap:"card",alts:["cart","cord"]},
 {en:"There's a two hundred and twenty baht fee on foreign cards.",fr:"Il y a 220 bahts de frais sur les cartes étrangères.",tip:"« fee » = frais. « foreign » sonne « forin », le « g » est muet.",gap:"fee",alts:["free","fine"]}
]},
{id:'thaiglish',title:'Comment parlent les Thaïs',ctx:"L'anglais des Thaïs est court, sans articles ni temps. C'est pas une faute, c'est leur système. Apprends à le décoder.",lines:[
 {en:"You want bag?",fr:"Tu veux un sac ?",tip:"Pas de « Do you », pas de « a ». Juste les mots qui comptent.",gap:"bag",alts:["back","big"]},
 {en:"No have.",fr:"On n'en a pas.",tip:"= « We don't have it ». Tu l'entendras partout.",gap:"have",alts:["half","hat"]},
 {en:"Cannot, sir.",fr:"Pas possible, monsieur.",tip:"« Cannot » tout seul = non. Pas la peine d'insister.",gap:"Cannot",alts:["Cannon","Candy"]},
 {en:"Up to you.",fr:"Comme tu veux.",tip:"Réponse préférée des Thaïs. Ça veut dire : c'est toi qui décides.",gap:"Up",alts:["Cup","Hop"]},
 {en:"Same same, but different.",fr:"Pareil… mais pas pareil.",tip:"L'expression culte. = c'est presque pareil.",gap:"different",alts:["difficult","deferent"]},
 {en:"You go where?",fr:"Tu vas où ?",tip:"L'ordre thaï : sujet, verbe, et la question à la fin. = « Where are you going? »",gap:"where",alts:["wear","there"]}
]},
{id:'bar',title:'Bar et soirée',ctx:"L'anglais des voyageurs : Anglais, Australiens. Rapide, relâché, plein de « mate ».",lines:[
 {en:"What are you drinking?",say:"What're ya drinking?",fr:"Tu bois quoi ?",tip:"« What are you » devient « whaddaya ». On te propose un verre.",gap:"drinking",alts:["thinking","dreaming"]},
 {en:"It's my round.",fr:"C'est ma tournée.",tip:"« round » = tournée. Après, c'est la tienne : « My round! »",gap:"round",alts:["ground","wound"]},
 {en:"Cheers, mate!",fr:"Santé, mec ! (ou : merci, mec !)",tip:"« Cheers » = santé OU merci chez les Anglais et Australiens. « mate » = pote.",gap:"mate",alts:["meat","matt"]},
 {en:"How are you going?",say:"How ya going?",fr:"Ça va ? (version australienne)",tip:"Les Australiens disent « How ya going? » pour « ça va ? ». Réponds « Good, you? ».",gap:"going",alts:["doing","growing"]},
 {en:"No worries.",fr:"Pas de souci.",tip:"Réponse à tout : merci, pardon, désolé. Australien pur jus.",gap:"worries",alts:["wars","warriors"]},
 {en:"Let's call it a night.",fr:"On arrête là pour ce soir.",tip:"« call it a night » = on rentre. « it a » devient « ida ».",gap:"night",alts:["nine","nice"]}
]},
{id:'gym',title:'Salle de sport',ctx:"Partager les machines sans se prendre la tête.",lines:[
 {en:"Are you using this?",say:"Are ya using this?",fr:"Tu utilises ça ?",tip:"« using this » devient « usingthis ». Réponds « Go ahead » ou « One more set ».",gap:"using",alts:["losing","choosing"]},
 {en:"How many sets have you got left?",fr:"Il te reste combien de séries ?",tip:"« have you got left » devient « havyagot-left ». « sets » = séries.",gap:"sets",alts:["seats","sits"]},
 {en:"Can I work in?",fr:"Je peux alterner avec toi ?",tip:"« work in » = partager la machine en alternant. Expression de salle.",gap:"work",alts:["walk","wake"]},
 {en:"Mind if I grab that?",fr:"Ça te dérange si je prends ça ?",tip:"Version courte de « Do you mind ». « grab » = prendre.",gap:"grab",alts:["crab","grip"]},
 {en:"Do you do monthly memberships?",fr:"Vous faites des abonnements au mois ?",tip:"« monthly » sonne « munthli ». « membership » = abonnement.",gap:"monthly",alts:["mostly","mouthly"]},
 {en:"Spot me on this one?",fr:"Tu m'assures sur celle-là ?",tip:"« spot » = assurer quelqu'un au développé couché. « this one » devient « thiswun ».",gap:"Spot",alts:["Sport","Spit"]}
]}
,
{id:'airport',title:'Aéroport',ctx:"Contrôles, porte, embarquement. Les annonces et les agents vont vite.",lines:[
 {en:"Can I see your boarding pass?",fr:"Je peux voir votre carte d'embarquement ?",tip:"« boarding pass » : le mot à capter. « Can I see your » sonne « kenaiseeyer ».",gap:"boarding",alts:["boring","bowling"]},
 {en:"Did you pack this bag yourself?",say:"Didja pack this bag yourself?",fr:"Vous avez fait ce sac vous-même ?",tip:"« Did you » devient « didja ». Réponds « Yes ».",gap:"pack",alts:["park","back"]},
 {en:"Any liquids over a hundred mils?",fr:"Des liquides de plus de 100 ml ?",tip:"« mils » = millilitres. « over a » devient « overa ».",gap:"liquids",alts:["lipids","liquor"]},
 {en:"Your gate is B12, boarding at ten forty.",fr:"Votre porte est la B12, embarquement à 10h40.",tip:"Deux infos : la porte et l'heure. Note-les, le reste on s'en fiche.",gap:"gate",alts:["gift","get"]},
 {en:"Please put your laptop in a separate tray.",fr:"Mettez votre ordinateur dans un bac à part.",tip:"« separate tray » = bac à part. « put your » devient « putcher ».",gap:"tray",alts:["train","try"]},
 {en:"Anything to declare?",fr:"Quelque chose à déclarer ?",tip:"Douane. Réponds « No, nothing ».",gap:"declare",alts:["decline","clear"]}
]},
{id:'delivery',title:'Grab Food et livraison',ctx:"Le livreur t'appelle. Il est en bas, il trouve pas, il a pas la monnaie.",lines:[
 {en:"Your order is on the way.",fr:"Votre commande est en route.",tip:"« on the way » = en route. « order is » devient « orderiz ».",gap:"way",alts:["wait","day"]},
 {en:"I'm downstairs, can you come down?",fr:"Je suis en bas, vous pouvez descendre ?",tip:"« downstairs » = en bas. « come down » = descendre.",gap:"downstairs",alts:["upstairs","downtown"]},
 {en:"Sorry, that item is sold out.",fr:"Désolé, cet article est épuisé.",tip:"« sold out » = plus dispo. « item » = article.",gap:"sold",alts:["cold","soul"]},
 {en:"Do you want cutlery with that?",fr:"Vous voulez des couverts avec ?",tip:"« cutlery » = couverts. Souvent coupé en « Cutlery? » tout court.",gap:"cutlery",alts:["cuddly","gallery"]},
 {en:"Leave it at the door, please.",fr:"Laissez-le devant la porte.",tip:"« Leave it at » devient « leavidat ».",gap:"door",alts:["floor","drawer"]},
 {en:"The rider can't find your building.",fr:"Le livreur ne trouve pas votre immeuble.",tip:"« rider » = le livreur à scooter. « can't find » : écoute le « t ».",gap:"find",alts:["fine","mind"]}
]},
{id:'island',title:'Îles et bateaux',ctx:"Longtail, ferry, snorkeling. Le capitaine crie par-dessus le moteur.",lines:[
 {en:"The last boat leaves at five.",fr:"Le dernier bateau part à 17h.",tip:"« leaves at » devient « leavezat ». Capte l'heure.",gap:"boat",alts:["bowl","vote"]},
 {en:"It's gonna be a bit choppy today.",fr:"Ça va secouer un peu aujourd'hui.",tip:"« choppy » = mer agitée. Prends un cachet avant.",gap:"choppy",alts:["chubby","happy"]},
 {en:"Do you want to rent a snorkel?",say:"Wanna rent a snorkel?",fr:"Tu veux louer un masque et tuba ?",tip:"« snorkel » = masque et tuba. « want to » devient « wanna ».",gap:"snorkel",alts:["sparkle","circle"]},
 {en:"Watch out for the jellyfish.",fr:"Fais gaffe aux méduses.",tip:"« Watch out » = attention. « jellyfish » = méduse.",gap:"jellyfish",alts:["shellfish","selfish"]},
 {en:"Low tide is around three.",fr:"La marée basse est vers 15h.",tip:"« tide » = marée. « around » = vers.",gap:"tide",alts:["tied","time"]},
 {en:"Grab a life jacket before you get on.",fr:"Prends un gilet de sauvetage avant de monter.",tip:"« life jacket » = gilet. « get on » = monter à bord.",gap:"jacket",alts:["racket","pocket"]}
]},
{id:'dating',title:'Rendez-vous',ctx:"Un date, un verre, une discussion. Les phrases sont douces mais rapides.",lines:[
 {en:"So, what brings you to Thailand?",fr:"Alors, qu'est-ce qui t'amène en Thaïlande ?",tip:"« what brings you » = qu'est-ce qui t'amène. Question d'ouverture classique.",gap:"brings",alts:["rings","brains"]},
 {en:"Have you been here before?",say:"Have ya been here before?",fr:"T'es déjà venu ici ?",tip:"« Have you been » devient « havyabin ». « before » = déjà.",gap:"before",alts:["belong","behave"]},
 {en:"Do you want to get out of here?",say:"Wanna get outta here?",fr:"On se casse d'ici ?",tip:"« get out of here » devient « get outta here ».",gap:"here",alts:["there","hair"]},
 {en:"I had a really good time tonight.",fr:"J'ai passé une super soirée.",tip:"« had a really » devient « hadareally ». Dis-le toi aussi.",gap:"time",alts:["team","tie"]},
 {en:"Text me when you get home.",fr:"Envoie-moi un message quand t'es rentré.",tip:"« text me » = écris-moi. « get home » = rentrer.",gap:"home",alts:["phone","hope"]},
 {en:"Are you seeing anyone?",fr:"Tu fréquentes quelqu'un ?",tip:"« seeing someone » = être avec quelqu'un. Pas « voir ».",gap:"seeing",alts:["singing","sitting"]}
]},
{id:'police',title:'Police et accident',ctx:"Contrôle, petit accident, amende. Reste calme, réponds court.",lines:[
 {en:"Can I see your license, please?",fr:"Votre permis, s'il vous plaît.",tip:"« license » = permis. Aie un permis international sur toi.",gap:"license",alts:["lesson","listen"]},
 {en:"You were going too fast.",fr:"Vous rouliez trop vite.",tip:"« too fast » = trop vite. « were going » devient « wergoin ».",gap:"fast",alts:["first","vast"]},
 {en:"Is anyone hurt?",fr:"Quelqu'un est blessé ?",tip:"« hurt » = blessé. Première question après un accident.",gap:"hurt",alts:["heart","hat"]},
 {en:"We need to fill out a report.",fr:"On doit remplir un constat.",tip:"« fill out » = remplir. « report » = rapport, constat.",gap:"report",alts:["resort","support"]},
 {en:"Do you have insurance?",fr:"Vous avez une assurance ?",tip:"« insurance » : accent sur « SHUR ». Montre l'appli.",gap:"insurance",alts:["entrance","assurance"]},
 {en:"The fine is five hundred baht.",fr:"L'amende est de 500 bahts.",tip:"« fine » ici = amende, pas « bien ».",gap:"fine",alts:["fire","find"]}
]},
{id:'phone',title:'Au téléphone',ctx:"Le plus dur : pas de visage, pas de gestes, et ça coupe.",lines:[
 {en:"Hi, is this Marvin?",fr:"Bonjour, c'est Marvin ?",tip:"Au téléphone, « is this » devient « izis ».",gap:"this",alts:["these","miss"]},
 {en:"Sorry, you're breaking up.",fr:"Désolé, ça coupe.",tip:"« breaking up » = la ligne coupe. Pas « rompre » ici.",gap:"breaking",alts:["baking","braking"]},
 {en:"Can you hear me now?",fr:"Tu m'entends maintenant ?",tip:"« hear me » devient « hearmi ».",gap:"hear",alts:["fear","hair"]},
 {en:"I'll call you back in five minutes.",fr:"Je te rappelle dans cinq minutes.",tip:"« call you back » = rappeler. « I'll » devient « ail ».",gap:"back",alts:["bag","black"]},
 {en:"Could you spell that for me?",fr:"Vous pouvez l'épeler ?",tip:"« spell » = épeler. Ta phrase pour les noms de rue.",gap:"spell",alts:["spill","smell"]},
 {en:"Hold on, I'll put you through.",fr:"Ne quittez pas, je vous transfère.",tip:"« put you through » = transférer l'appel. « hold on » = attendez.",gap:"through",alts:["true","throw"]}
]}
];
const PHRASES = [
 {g:'Comprendre',en:"Sorry, could you say that again?",fr:"Pardon, vous pouvez répéter ?"},
 {g:'Comprendre',en:"Could you speak a bit slower, please?",fr:"Vous pouvez parler un peu plus lentement ?"},

function fresh(){ return { v: 3, updated: 0, settings: { voice: 'auto', rate: 1 }, streak: { count: 0, last: null }, days: {}, words: {}, hard: [], listen: null, parle: null, level: null, baseline: null, measures: [], cando: {}, seen: {}, sessions: 0 }; }
function migrate(s){
  if (!s || typeof s !== 'object') return null;
  if (s.v === 1) { s.v = 2; s.sessions = Object.keys(s.days || {}).length; s.seen = {}; s.today = null; }
  if (s.v === 2) {
    s.v = 3; s.listen = null; delete s.today; s.parle = null; s.level = null; s.baseline = null; s.measures = []; s.cando = {};
    const d = {}; Object.entries(s.days || {}).forEach(([k, v]) => { d[k] = (v && (v.listen || v.parle)) ? v : { listen: v }; }); s.days = d;
    delete s.xp; delete s.badges; delete s.blitzBest; s.settings = s.settings || {}; delete s.settings.sound; s.seen = s.seen || {}; s.hard = s.hard || [];
  }
  return s.v === 3 ? s : null;
}
function load(){ try { return migrate(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) {} return null; }
let state = load() || fresh();
let ui = { tab: 'parle', step: {}, review: null, sheet: false, toast: null, vocab: {}, drill: null, busy: null, pickSit: false };
let sampleFn = null, dbRef = null, dbTimer = null, dbChain = Promise.resolve();
function save(){
  state.updated = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  if (dbRef) { clearTimeout(dbTimer); dbTimer = setTimeout(() => { const snap = JSON.parse(JSON.stringify(state)); dbChain = dbChain.then(() => dbRef.set(snap)).catch(() => {}); }, 1500); }
}
function toast(msg){
  clearTimeout(ui.toast); let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; ui.toast = setTimeout(() => el.remove(), 2400);
}
function markDay(k, kind, data){
  const d = state.days[k] || (state.days[k] = {}); const first = !d.parle && !d.listen && !d.dialogue; d[kind] = data;
  if (first) { const y = addDays(k, -1); if (state.streak.last === y) state.streak.count += 1; else if (state.streak.last !== k) state.streak.count = 1; state.streak.last = k; }
}
function streakNow(){ const s = state.streak; if (!s.last) return 0; const k = todayKey(); return (s.last === k || s.last === addDays(k, -1)) ? s.count : 0; }
function dayNumber(){ return Object.keys(state.days).length + (state.days[todayKey()] ? 0 : 1); }

// ---------- speech ----------
const TTS = {
  voices: [],
  ok(){ return 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window; },
  refresh(){ try { this.voices = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)); } catch (e) { this.voices = []; } },
  pick(){
    const pref = state.settings.voice;
    if (pref && pref !== 'auto') { const v = this.voices.find(v => v.name === pref); if (v) return v; }
    const order = ['Samantha', 'Ava', 'Allison', 'Nicky', 'Zoe', 'Daniel', 'Karen', 'Google US English', 'Google UK English Female', 'Microsoft Aria', 'Microsoft Jenny', 'Microsoft Zira'];
    for (const n of order) { const v = this.voices.find(v => v.name.startsWith(n)); if (v) return v; }
    return this.voices.find(v => v.lang === 'en-US') || this.voices[0] || null;
  },
  utter(text, rate){ const u = new SpeechSynthesisUtterance(text); const v = this.pick(); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US'; u.rate = rate; u.pitch = 1; u.onstart = () => setPlaying(true); u.onend = () => setPlaying(false); u.onerror = () => setPlaying(false); return u; },
  speak(text, rate){ if (!this.ok()) { toast('Pas de synthèse vocale sur ce navigateur'); return; } try { speechSynthesis.cancel(); speechSynthesis.speak(this.utter(text, rate)); } catch (e) { setPlaying(false); } },
  words(text){ if (!this.ok()) { toast('Pas de synthèse vocale sur ce navigateur'); return; } try { speechSynthesis.cancel(); text.split(/\s+/).map(w => w.replace(/^[^\w'’]+|[^\w'’]+$/g, '')).filter(Boolean).forEach(w => speechSynthesis.speak(this.utter(w, 0.85))); } catch (e) { setPlaying(false); } },
  stop(){ try { speechSynthesis.cancel(); } catch (e) {} setPlaying(false); },
  voice2(){ const v1 = this.pick(); const others = this.voices.filter(v => v !== v1); const male = ['Daniel', 'Aaron', 'Fred', 'Arthur', 'Gordon', 'Rishi', 'Oliver', 'Google UK English Male', 'Microsoft Guy', 'Microsoft Ryan', 'Microsoft David']; for (const n of male) { const v = others.find(v => v.name.startsWith(n)); if (v) return v; } return others.find(v => v.lang === (v1 ? v1.lang : 'en-US')) || others[0] || null; },
  dialogue(lines, rate){ if (!this.ok()) { toast('Pas de synthèse vocale sur ce navigateur'); return; } try { speechSynthesis.cancel(); const v2 = this.voice2(); lines.forEach(l => { const u = this.utter(l.en, rate); if (l.s === 1) { if (v2) { u.voice = v2; u.lang = v2.lang; } else u.pitch = 0.85; } speechSynthesis.speak(u); }); } catch (e) { setPlaying(false); } },
  unlock(){ if (this.ok()) { try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {} } }
};
if (TTS.ok()) { TTS.refresh(); speechSynthesis.onvoiceschanged = () => { TTS.refresh(); if (ui.sheet) renderSheet(); }; }
function setPlaying(on){ document.querySelectorAll('.play').forEach(b => b.classList.toggle('playing', on)); }
function playLine(line, mode){ const rate = state.settings.rate || 1; if (mode === 'slow') TTS.speak(line.en, 0.62); else if (mode === 'words') TTS.words(line.en); else TTS.speak(line.say || line.en, rate); }

// ---------- words (spaced recall) ----------
function dueWords(){ const k = todayKey(); return Object.values(state.words).filter(w => w.due <= k).sort((a, b) => a.box - b.box); }
function wordKey(w){ return norm(w).replace(/[^a-z0-9'\-\s/.…]/g, '').replace(/\s+/g, '-').slice(0, 48); }
function addWord(w, fr, ex, exfr, src){
  const key = wordKey(w); if (!key || state.words[key]) return false;
  state.words[key] = { key, w: String(w).trim(), fr: fr || '', ex: ex || '', exfr: exfr || '', box: 1, due: todayKey(), added: todayKey(), src: src || '' };
  return true;
}
function gradeWord(key, known){ const w = state.words[key]; if (!w) return; w.box = known ? Math.min(w.box + 1, INTERVALS.length - 1) : 1; w.due = addDays(todayKey(), INTERVALS[w.box]); w.last = todayKey(); save(); }
function activeWords(){ return Object.values(state.words).filter(w => w.box >= 3).length; }

// ---------- Parle session ----------
function candoCount(g){ return state.cando[g] || 0; }
function candoStatus(g){ const n = candoCount(g); return n >= 2 ? 'done' : n === 1 ? 'wip' : (Object.values(state.days).some(d => d.parle && d.parle.g === g) ? 'wip' : 'todo'); }
function pickPrompt(k){
  const used = {}; Object.values(state.days).forEach(d => { if (d.parle && d.parle.pid) used[d.parle.pid] = (used[d.parle.pid] || 0) + 1; });
  const y = state.days[addDays(k, -1)]; const yg = y && y.parle ? y.parle.g : null;
  const open = CANDO.filter(c => candoStatus(c.id) !== 'done' && c.id !== yg);
  const goals = open.length ? open : CANDO.filter(c => c.id !== yg);
  const g = goals[hash('g' + k) % goals.length];
  const ps = PROMPTS.filter(p => p.g === g.id); const min = Math.min(...ps.map(p => used[p.id] || 0));
  const cands = ps.filter(p => (used[p.id] || 0) === min);
  return cands[hash('p' + k) % cands.length];
}
function ensureParle(){
  const k = todayKey();
  if (!state.parle || state.parle.date !== k) { const p = pickPrompt(k); state.parle = { date: k, pid: p.id, text: '', result: null, repeated: false, done: false }; save(); }
}
function promptOf(id){ return PROMPTS.find(p => p.id === id) || PROMPTS[0]; }
function weeklyDue(){ if (!state.baseline) return false; const last = state.measures.length ? state.measures[state.measures.length - 1].date : state.baseline.date; return daysBetween(last, todayKey()) >= 7; }
function currentLevel(){ const m = state.measures.length ? state.measures[state.measures.length - 1] : state.baseline; return m ? m.cefr : null; }
function parleSeries(){ return Object.keys(state.days).sort().filter(k => state.days[k].parle && state.days[k].parle.errors != null).slice(-8).map(k => ({ k, e: state.days[k].parle.errors })); }

// ---------- Écoute session (from v2) ----------
function sitForDate(key){
  const counts = {}; SITS.forEach(s => counts[s.id] = 0);
  Object.values(state.days).forEach(d => { if (d.listen && counts[d.listen.sit] != null) counts[d.listen.sit]++; });
  const min = Math.min(...Object.values(counts)); const cands = SITS.filter(s => counts[s.id] === min);
  return cands[hash(key) % cands.length];
}
function newListen(sit, extra){ return { date: todayKey(), sit: sit.id, title: sit.title, ctx: sit.ctx, lines: null, plan: null, step: 0, ok: 0, total: 0, added: 0, extra: !!extra }; }
function ensureListen(){ const k = todayKey(); if (!state.listen || state.listen.date !== k) { state.listen = newListen(sitForDate(k), false); save(); } }
function sessionLines(){ const t = state.listen; if (t.lines) return t.lines; const sit = SITS.find(s => s.id === t.sit) || SITS[0]; return sit.lines.map((l, i) => ({ ...l, id: sit.id + '-' + i })); }
function gapIndex(line){ const toks = line.en.split(/\s+/); const i = toks.findIndex(t => norm(t) === norm(line.gap)); return i >= 0 ? { i, toks } : null; }
function buildPlan(){
  const lines = sessionLines(); const plan = [{ t: 'intro' }]; const types = ['listen', 'gap', 'order', 'listen', 'gap', 'order'];
  lines.forEach((l, i) => { let t = types[i % types.length]; const n = l.en.split(/\s+/).length; if (t === 'order' && (n > 8 || n < 3)) t = 'gap'; if (t === 'gap' && !gapIndex(l)) t = 'listen'; plan.push({ t, i }); });
  const hardHere = lines.map((l, i) => i).filter(i => state.hard.includes(lines[i].id));
  [...new Set([...hardHere, 0, Math.min(3, lines.length - 1)])].slice(0, 2).forEach(i => plan.push({ t: 'repeat', i }));
  plan.push({ t: 'done' }); return plan;
}
function currentStep(){ const t = state.listen; if (!t.plan) return { t: 'intro' }; return t.plan[Math.min(t.step, t.plan.length - 1)]; }
function nextStep(){
  const t = state.listen;
  if (!t.plan) { t.plan = buildPlan(); t.step = 1; } else t.step = Math.min(t.step + 1, t.plan.length - 1);
  ui.step = {}; if (currentStep().t === 'done') finishListen(); save(); render();
  const st = currentStep(); if (st.t === 'gap' || st.t === 'listen') playLine(sessionLines()[st.i], 'normal');
}
function finishListen(){ const t = state.listen; state.sessions = (state.sessions || 0) + 1; if (!t.extra) markDay(t.date, 'listen', { sit: t.sit, ok: t.ok, total: t.total }); save(); }

// ---------- Dialogue du jour ----------
function dialForDate(k){ const counts = {}; DIALOGUES.forEach(d => counts[d.id] = 0); Object.values(state.days).forEach(d => { if (d.dialogue && counts[d.dialogue.id] != null) counts[d.dialogue.id]++; }); const min = Math.min(...Object.values(counts)); const c = DIALOGUES.filter(d => counts[d.id] === min); return c[hash('d' + k) % c.length]; }
function startDialogue(id){ ui.dial = { id, stage: 'listen', qi: 0, chosen: null, ok: 0, plays: 0 }; ui.step = {}; render(); }
function finishDialogue(){ const u = ui.dial; const k = todayKey(); const d = state.days[k]; if (!(d && d.dialogue)) markDay(k, 'dialogue', { id: u.id, ok: u.ok, total: DIALOGUES.find(x => x.id === u.id).qs.length }); save(); }
// ---------- Quiz éclair (QCM) ----------
function quizQuestion(v, pool, dir){ const ds = shuffle(pool.filter(x => x.id !== v.id && x.fr !== v.fr && x.en !== v.en)).slice(0, 3); const opts = shuffle([v, ...ds]).map(x => ({ id: x.id, label: dir === 'en' ? x.fr : x.en })); return { v, dir, opts }; }
function startQuiz(mode){
  mode = mode || 'mix';
  let qs;
  if (mode === 'convo') {
    const seenN = id => state.seen['c:' + id] || 0;
    const items = shuffle(CONVO).sort((a, b) => seenN(a.id) - seenN(b.id)).slice(0, 8);
    qs = items.map(it => ({ type: 'convo', it, order: shuffle([0, 1, 2, 3]) }));
  } else {
    const pro = mode === 'pro';
    const proWords = new Set(VOCAB_ALL.filter(v => v.pro).map(v => v.en.toLowerCase()));
    const mine = Object.values(state.words).filter(w => w.fr && (!pro || w.src === 'texte' || proWords.has(String(w.w).toLowerCase()))).map(w => ({ id: 'w:' + w.key, en: w.w, fr: w.fr, ex: w.ex, theme: 'mine', key: w.key }));
    const bank = pro ? VOCAB_ALL.filter(v => v.pro) : VOCAB_ALL;
    const picks = shuffle(mine).slice(0, pro ? 3 : 5); const rest = shuffle(bank.filter(x => !picks.some(p => p.en === x.en))).slice(0, 10 - picks.length); picks.push(...rest);
    qs = shuffle(picks).map((v, i) => { let pool = v.theme === 'mine' ? (mine.length >= 4 ? mine : bank) : bank.filter(x => x.theme === v.theme); if (pool.length < 4) pool = bank; return quizQuestion(v, pool, i % 2 ? 'fr' : 'en'); });
  }
  ui.quiz = { mode, qs, i: 0, score: 0, answered: false, done: false }; ui.step = {}; render();
  const q = qs[0]; if (q.type === 'convo') TTS.speak(q.it.q, state.settings.rate || 1); else if (q.dir === 'en') TTS.speak(q.v.en, state.settings.rate || 1);
}
function quizNext(){ const q = ui.quiz; if (!q) return; q.i++; q.answered = false; if (q.i >= q.qs.length) { q.done = true; save(); render(); return; } render(); const cur = q.qs[q.i]; if (cur.type === 'convo') TTS.speak(cur.it.q, state.settings.rate || 1); else if (cur.dir === 'en') TTS.speak(cur.v.en, state.settings.rate || 1); }

// ---------- render ----------
function renderTop(){
  $('#dateLine').textContent = shortDate(todayKey()) + ' · jour ' + dayNumber();
  const s = streakNow(); $('#streakN').textContent = s + (s > 1 ? ' jours' : ' jour'); $('#streakChip').classList.toggle('on', s > 0);
}
function render(){
  ensureParle(); ensureListen(); renderTop();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === ui.tab));
  const main = $('#main'); main.scrollTop = 0;
  if (ui.tab === 'parle') main.innerHTML = renderParle();
  else if (ui.tab === 'ecoute') main.innerHTML = renderEcoute();
  else if (ui.tab === 'mots') main.innerHTML = renderMots();
  else main.innerHTML = renderProgres();
  if (ui.sheet) renderSheet(); else $('#overlay').innerHTML = '';
}
function busyCard(label){ return `<div class="card"><p class="lead"><span class="spin"></span>&nbsp; ${esc(label)}</p><p class="note">Claude lit ce que tu as dit. 10 à 40 secondes.</p></div>`; }
function playRow(text){
  return `<div class="playrow"><button class="play" data-action="say-play" data-t="${esc(text)}" aria-label="Écouter">${ICON.play}</button>
    <div class="speedrow"><button class="btn" data-action="say-play" data-slow="1" data-t="${esc(text)}">${ICON.turtle} Lent</button><button class="btn" data-action="say-words" data-t="${esc(text)}">Mot par mot</button></div></div>`;
}

// ---------- Parler ----------
function renderParle(){
  const p = state.parle; const pr = promptOf(p.pid); const goal = CANDO.find(c => c.id === pr.g) || CANDO[0];
  const due = dueWords().length; const lis = state.listen;
  let h = '<div class="stack">';
  if (!state.baseline && !ui.skipPlacement) {
    if (ui.busy === 'placement') h += busyCard('Claude évalue ton niveau…');
    else h += `<div class="card soft"><div class="head"><span class="mono acc">Avant de commencer</span><span class="pill">2 min</span></div>
      <p class="lead">${esc(PLACEMENT)}</p>
      <textarea id="placeIn" placeholder="Hi, my name is Marvin, I'm from…">${esc(ui.placeText || '')}</textarea>
      <button class="btn amber needs-claude" data-action="placement-send">${ICON.mic} Envoyer pour évaluation</button>
      <p class="note no-claude">Il faut être connecté à ton compte Claude pour l'évaluation. Ouvre la page depuis l'app Claude.</p>
      <button class="btn line small" data-action="placement-skip">Plus tard</button></div>`;
  }
  if (ui.busy === 'parle') h += busyCard('Claude corrige…');
  else if (!p.result) {
    h += `<div class="card"><div class="head"><span class="mono acc">Aujourd'hui · Parle</span><span class="pill">${esc(goal.t)}</span></div>
      <p class="lead">${esc(pr.fr)}</p>
      <div class="hint">${pr.hints.map(x => `<span>${esc(x)}</span>`).join('')}</div>
      <textarea id="parleIn" placeholder="Dis-le en anglais. Appuie sur le micro du clavier et parle, sans chercher la perfection.">${esc(p.text || '')}</textarea>
      <button class="btn amber needs-claude" data-action="parle-send">${ICON.mic} Envoyer à Claude</button>
      <p class="note no-claude">Sans compte Claude, pas de correction. Ton texte est gardé quand même.</p>
      ${pr.g !== 'pro' ? `<button class="btn line small" data-action="parle-pro">Plutôt une consigne pro</button>` : ''}
      <p class="note">Dictée : appuie sur le micro du clavier, parle en anglais. Si ça écrit en français, change la langue du clavier (touche globe).</p>
    </div>`;
  } else {
    const r = p.result;
    h += `<div class="card"><div class="head"><span class="mono acc">Ta version corrigée</span><span class="pill ${r.ok ? 'green' : 'amber'}">${r.ok ? 'Consigne réussie' : 'Presque'}</span></div>
      <p class="en">${esc(r.corrected)}</p>${playRow(r.corrected)}
      <p class="note">${r.words} mots · ${r.errors} erreur${r.errors > 1 ? 's' : ''} pour 100 mots</p>
      ${r.good ? `<div class="tip"><span class="lbl">Bien joué</span>${esc(r.good)}</div>` : ''}
      <details><summary class="note" style="cursor:pointer">Ce que tu avais dit</summary><p class="note" style="margin-top:6px">${esc(p.text)}</p></details></div>`;
    if (r.gaps && r.gaps.length) h += `<div class="card"><div class="head"><span class="mono acc">Ce qui te manquait</span><span class="pill">gardé dans Mots</span></div>
      ${r.gaps.map(g => `<div class="gap">${g.said ? `<span class="said">${esc(g.said)}</span>` : ''}<span class="better">${esc(g.better)} <button class="btn small line" style="display:inline-flex;min-height:30px;padding:0 8px;vertical-align:middle" data-action="say-play" data-t="${esc(g.better)}" aria-label="Écouter">${ICON.speaker}</button></span><span class="why">${esc(g.fr)}${g.why ? ' · ' + esc(g.why) : ''}</span>${g.ex ? `<span class="why" style="color:var(--fg)">« ${esc(g.ex)} »</span>` : ''}</div>`).join('')}
      ${r.tip ? `<div class="tip"><span class="lbl">Pour la prochaine fois</span>${esc(r.tip)}</div>` : ''}</div>`;
    h += `<div class="card"><div class="head"><span class="mono acc">Répète</span><span class="pill">2 min</span></div>
      <p class="note">Écoute en lent, puis en normal. Dis ta version corrigée trois fois à voix haute, en imitant le rythme.</p>
      ${p.repeated ? `<p class="verdict ok">Fait. Session de parole terminée pour aujourd'hui.</p><button class="btn line small" data-action="parle-again">Refaire une consigne</button>` : `<button class="btn amber" data-action="parle-repeated">Je l'ai dite trois fois</button>`}</div>`;
  }
  if (weeklyDue()) h += `<div class="card soft"><div class="head"><span class="mono acc">Bilan hebdo</span><span class="pill amber">à faire</span></div><p class="note">Une semaine est passée. Deux minutes de parole libre pour mesurer tes progrès.</p><button class="btn" data-action="goto-progres">Faire le bilan</button></div>`;
  h += `<div class="row2"><button class="btn" data-action="goto-review">Rappel · ${due} mot${due > 1 ? 's' : ''}</button><button class="btn" data-action="goto-ecoute">Écouter · ${esc(lis.title)}</button></div>`;
  h += `<button class="btn" data-action="quiz-go" data-mode="convo">QCM conversation · 2 min</button>`;
  return h + '</div>';
}

// ---------- Écouter ----------
function progressBar(){ const t = state.listen; if (!t.plan) return ''; const n = t.plan.length - 2, cur = t.step - 1; let h = '<div class="progress">'; for (let i = 0; i < n; i++) h += `<i class="${i < cur ? 'done' : i === cur ? 'cur' : ''}"></i>`; return h + '</div>'; }
function playBlock(){
  return `<div class="playrow"><button class="play" data-action="play" data-mode="normal" aria-label="Écouter">${ICON.play}</button>
    <div class="speedrow"><button class="btn" data-action="play" data-mode="slow">${ICON.turtle} Lent</button><button class="btn" data-action="play" data-mode="words">Mot par mot</button></div></div>`;
}
function lineReveal(line){
  return `<p class="en">${esc(line.en)}</p><p class="fr">${esc(line.fr)}</p>
    ${line.say && line.say !== line.en ? `<div class="say"><span class="lbl">Ça sonne comme</span>${esc(line.say)}</div>` : ''}
    ${line.tip ? `<div class="tip"><span class="lbl">Le truc</span>${esc(line.tip)}</div>` : ''}
    <button class="btn line small needs-claude" data-action="explain">Explique-moi plus</button><div class="explain say" id="explain" style="display:none"></div>`;
}
function renderEcoute(){
  if (ui.dial) return renderDialogue();
  const t = state.listen; const st = currentStep(); const lines = sessionLines();
  const stepN = t.plan ? `${Math.min(t.step, t.plan.length - 2)}/${t.plan.length - 2}` : '';
  if (st.t === 'intro') {
    const done = !!(state.days[t.date] && state.days[t.date].listen);
    let h = `<div class="stack">${dialogueCard()}<div class="card"><div class="head"><span class="mono acc">${done ? 'Déjà fait aujourd\'hui' : 'Situation du jour'}</span><span class="pill">${lines.length} phrases · 5 min</span></div>
      <h1 class="h1">${esc(t.title)}</h1><p class="note">${esc(t.ctx)}</p>
      <button class="btn amber" data-action="start">${done ? 'Refaire' : 'Commencer'}</button>
      <button class="btn line small" data-action="pick-sit">${ui.pickSit ? 'Fermer' : 'Choisir une autre situation'}</button></div>`;
    if (ui.pickSit) h += `<div class="card"><div class="chips">${SITS.map(s => `<button class="chipw ${s.id === t.sit ? 'on' : ''}" data-action="choose-sit" data-sit="${s.id}">${esc(s.title)}</button>`).join('')}</div></div>`;
    h += `<p class="note">Écoute à vitesse normale, puis lente, puis mot par mot. Tape « Pas tout » pour garder les mots que tu n'as pas captés.</p></div>`;
    return h;
  }
  if (st.t === 'listen') return progressBar() + renderListen(lines[st.i], stepN);
  if (st.t === 'gap') return progressBar() + renderGap(lines[st.i], stepN);
  if (st.t === 'order') return progressBar() + renderOrder(lines[st.i], stepN);
  if (st.t === 'repeat') return progressBar() + renderRepeat(lines[st.i], stepN);
  return renderListenDone();
}
function renderListen(line, stepN){

  if (series.length) { const max = Math.max(10, ...series.map(x => x.e)); const first = series[0].e, lastE = series[series.length - 1].e; const delta = series.length > 1 ? lastE - first : 0;
    h += `<div class="card"><div class="head"><span class="mono acc">Erreurs pour 100 mots</span><span class="mono" style="color:${delta < 0 ? 'var(--green)' : 'var(--muted)'}">${series.length > 1 ? (delta <= 0 ? '' : '+') + delta + ' depuis le début' : 'première mesure'}</span></div>

// ---------- Claude ----------
const LEVEL = "Marvin est français, niveau A2 environ, il vit en Thaïlande et veut parler anglais au quotidien (expliquer ce qu'il veut, raconter sa journée, parler de ce qu'il aime). Son métier : SEO local, fiches Google Business Profile, scripts avec Claude Code ; utilise les vrais termes anglais du métier quand c'est le sujet. Il dicte ses réponses avec le micro du clavier : la transcription peut contenir des fautes de reconnaissance, ignore-les. Parle-lui en français, simple, tutoiement, sans blabla, sans jugement.";
function claudeFail(e, fallback){
  if (e && e.code === 'not_granted') { document.getElementById('app').classList.remove('has-claude'); return 'Claude n\'est pas autorisé sur cette page. Rouvre-la depuis l\'app Claude et accepte.'; }
  if (e && e.code === 'rate_limited') return 'Trop de demandes pour le moment. Réessaie dans quelques minutes.';
  if (e && e.code === 'cancelled') return '';
  return fallback;
}
async function explain(line, box, btn){
  if (!sampleFn) return; btn.disabled = true; box.style.display = 'block'; box.textContent = 'Claude réfléchit…';
  try { const { text } = await sampleFn(`${LEVEL}\nPhrase anglaise : "${line.en}"\nTraduction : "${line.fr}"\nEn 3 phrases courtes max : (1) le sens exact et dans quel contexte on l'entend, (2) ce qui est dur à entendre à vitesse normale (mots avalés, liaisons, contractions), (3) un truc concret pour la reconnaître la prochaine fois. Pas de titre, pas de liste.`, { modelTier: 'quick', onText: ({ text }) => { box.textContent = text; } }); box.textContent = text; }
  catch (e) { box.textContent = (e && e.text) || claudeFail(e, 'Claude n\'a pas répondu.'); }
  finally { btn.disabled = false; }
}
function cleanGaps(arr, max){ return (Array.isArray(arr) ? arr : []).map(g => (typeof g === 'string' ? { better: g } : g || {})).filter(g => g.better).map(g => ({ said: String(g.said || '').slice(0, 80), better: String(g.better).slice(0, 80), fr: String(g.fr || '').slice(0, 80), why: String(g.why || '').slice(0, 160), ex: String(g.ex || '').slice(0, 120) })).slice(0, max); }
function keepGaps(gaps, src){ let n = 0; gaps.forEach(g => { if (addWord(g.better, g.fr, g.ex, '', src)) n++; }); return n; }
async function correctSpeech(){
  const p = state.parle; const pr = promptOf(p.pid); if (!sampleFn || !p.text.trim()) return;
  ui.busy = 'parle'; render();
  try {
    const r = await sampleFn.json(`${LEVEL}\nConsigne donnée à Marvin (en français) : "${pr.fr}"\nCe que Marvin a dit en anglais (transcription brute) : "${p.text.trim().slice(0, 3000)}"\nRéponds UNIQUEMENT avec un objet JSON :\n{"corrected": "sa version corrigée, naturelle à l'oral, en gardant ses idées et à peu près sa longueur, niveau A2-B1 (pas de vocabulaire compliqué)",\n "gaps": [{"said": "ce qu'il a dit ou tenté (vide s'il a contourné ou sauté)", "better": "le mot ou l'expression juste, court", "fr": "sens en français", "why": "1 phrase courte en français", "ex": "une phrase courte et simple en anglais qui l'utilise"}],\n "good": "1 phrase en français sur ce qu'il a bien fait",\n "tip": "1 conseil concret en français pour la prochaine fois",\n "errors_per_100": nombre entier d'erreurs pour 100 mots (grammaire, mot manquant ou faux ; pas l'accent ni la ponctuation),\n "words": nombre de mots qu'il a produits,\n "task_done": true si la consigne est accomplie de façon compréhensible même avec des fautes}\n"gaps" : 3 maximum, les plus utiles pour lui au quotidien. Si son texte est trop court (moins de 8 mots) ou hors sujet, mets task_done à false et explique dans "tip".`, { modelTier: 'default', cache: false });
    if (!r || !r.corrected) throw { code: 'invalid_json' };
    const res = { corrected: String(r.corrected).slice(0, 1500), gaps: cleanGaps(r.gaps, 3), good: String(r.good || '').slice(0, 300), tip: String(r.tip || '').slice(0, 300), errors: Math.max(0, Math.min(60, Math.round(Number(r.errors_per_100) || 0))), words: Math.max(0, Math.round(Number(r.words) || p.text.trim().split(/\s+/).length)), ok: !!r.task_done };
    p.result = res; p.doneAt = Date.now();
    const n = keepGaps(res.gaps, 'parle');
    markDay(p.date, 'parle', { pid: p.pid, g: pr.g, errors: res.errors, words: res.words, ok: res.ok });
    if (res.ok) state.cando[pr.g] = (state.cando[pr.g] || 0) + 1;
    ui.busy = null; save(); render(); TTS.speak(res.corrected, state.settings.rate || 1);
    if (n) toast(n + (n > 1 ? ' mots gardés dans Mots' : ' mot gardé dans Mots'));
  } catch (e) { ui.busy = null; render(); toast(claudeFail(e, 'Claude n\'a pas réussi. Réessaie, ou dis-en un peu plus.')); }
}
async function assess(text, kind){
  if (!sampleFn || !text.trim()) return;
  ui.busy = kind; render();
  try {
    const r = await sampleFn.json(`${LEVEL}\n${kind === 'placement' ? 'Évaluation de départ.' : 'Bilan hebdomadaire.'} Consigne : "${kind === 'placement' ? PLACEMENT : WEEKLY}"\nCe que Marvin a dit en anglais (transcription brute) : "${text.trim().slice(0, 4000)}"\nRéponds UNIQUEMENT avec un objet JSON :\n{"cefr": "A1" | "A1+" | "A2" | "A2+" | "B1" | "B1+" | "B2", "summary": "2 phrases en français, encourageantes et honnêtes, sur son niveau à l'oral", "strengths": ["3 points forts courts en français"], "gaps": [{"better": "mot ou expression qu'il lui manquait", "fr": "sens", "ex": "phrase simple en anglais qui l'utilise"}], "errors_per_100": nombre entier, "words": nombre de mots produits}\n"gaps" : 5 maximum, les plus utiles.`, { modelTier: 'default', cache: false });
    if (!r || !r.cefr) throw { code: 'invalid_json' };
    const m = { date: todayKey(), cefr: String(r.cefr).slice(0, 4), summary: String(r.summary || '').slice(0, 400), strengths: (Array.isArray(r.strengths) ? r.strengths : []).map(String).slice(0, 3), gaps: cleanGaps(r.gaps, 5), errors: Math.max(0, Math.min(60, Math.round(Number(r.errors_per_100) || 0))), words: Math.max(0, Math.round(Number(r.words) || text.trim().split(/\s+/).length)) };
    if (kind === 'placement') { state.baseline = m; state.level = m.cefr; ui.placeText = ''; } else { state.measures.push(m); state.level = m.cefr; ui.weeklyOpen = false; ui.weeklyText = ''; }
    const n = keepGaps(m.gaps, kind);
    ui.busy = null; save(); ui.tab = 'progres'; render(); toast('Niveau estimé : ' + m.cefr + (n ? ' · ' + n + ' mots gardés' : ''));
  } catch (e) { ui.busy = null; render(); toast(claudeFail(e, 'Claude n\'a pas réussi. Réessaie avec un peu plus de texte.')); }
}
async function extractWords(text){
  if (!sampleFn || !text.trim()) return;
  ui.extract = { text, busy: true }; render();
  try {
    const arr = await sampleFn.json(`${LEVEL}\nVoici un texte en anglais que Marvin a lu pour son travail :\n"""${text.trim().slice(0, 6000)}"""\nChoisis les 6 mots ou expressions les plus utiles pour lui (techniques ou courants, qu'un francophone A2 ne connaît probablement pas, et dont il aura besoin à l'oral ou à l'écrit). Réponds UNIQUEMENT avec un JSON array : [{"w": "mot ou expression tel qu'écrit", "fr": "sens court en français dans ce contexte", "ex": "une phrase courte et simple en anglais qui l'utilise"}]`, { modelTier: 'quick' });
    const res = (Array.isArray(arr) ? arr : []).filter(x => x && x.w).slice(0, 8).map(x => ({ w: String(x.w).slice(0, 60), fr: String(x.fr || '').slice(0, 80), ex: String(x.ex || '').slice(0, 140), kept: !!state.words[wordKey(x.w)] }));
    if (!res.length) throw { code: 'invalid_json' };
    ui.extract = { text, res }; render();
  } catch (e) { ui.extract = { text }; render(); toast(claudeFail(e, 'Claude n\'a pas réussi. Essaie avec un texte plus court.')); }
}
async function fillMeanings(line, words){
  if (!sampleFn || !words.length) return;
  try { const arr = await sampleFn.json(`Dans la phrase anglaise "${line.en}" (en français : "${line.fr}"), donne le sens en français de ces mots : ${JSON.stringify(words)}. Réponds UNIQUEMENT avec un JSON array [{"w":"mot","fr":"sens court en français"}].`, { modelTier: 'quick' });
    if (Array.isArray(arr)) { arr.forEach(x => { const k = wordKey(x.w); if (state.words[k] && !state.words[k].fr) state.words[k].fr = String(x.fr || '').slice(0, 60); }); save(); if (ui.tab === 'mots') render(); } } catch (e) {}
}

document.addEventListener('change', e => { if (e.target.id === 'voiceSel') { state.settings.voice = e.target.value; save(); } });
document.addEventListener('input', e => {
  const t = e.target; if (!t) return;
  if (t.id === 'parleIn') { state.parle.text = t.value; save(); }
  else if (t.id === 'placeIn') ui.placeText = t.value;
  else if (t.id === 'weeklyIn') ui.weeklyText = t.value;
  else if (t.id === 'extractIn') { ui.extract = ui.extract || {}; ui.extract.text = t.value; }
});
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { ui.tab = tab.dataset.tab; ui.step = {}; ui.drill = null; ui.review = null; ui.dial = null; ui.quiz = null; ui.pickSit = false; TTS.stop(); render(); return; }

  if (el.dataset.action === 'close-settings' && e.target.closest('[data-stop]') && !e.target.closest('.btn')) return;

  const t = state.listen; const lines = t ? sessionLines() : []; const st = t ? currentStep() : null; const line = st && st.i != null ? lines[st.i] : null;
  switch (a) {
    case 'open-settings': ui.sheet = true; ui.confirmReset = false; renderSheet(); break;
    case 'close-settings': ui.sheet = false; ui.confirmReset = false; $('#overlay').innerHTML = ''; break;

    case 'reset': ui.confirmReset = true; renderSheet(); break;
    case 'reset-no': ui.confirmReset = false; renderSheet(); break;
    case 'reset-yes': state = fresh(); ui = { tab: 'parle', step: {}, sheet: false, vocab: {}, drill: null, review: null }; save(); render(); toast('Remis à zéro'); break;
    // Parler
    case 'parle-send': { const v = ($('#parleIn') || {}).value || ''; state.parle.text = v; if (v.trim().split(/\s+/).length < 4) { toast('Dis-en un peu plus, au moins une phrase'); break; } TTS.unlock(); correctSpeech(); break; }
    case 'parle-repeated': state.parle.repeated = true; save(); render(); toast('Bien. À demain, ou continue avec Écouter.'); break;
    case 'parle-again': { const k = todayKey(); const used = state.parle.pid; let p = pickPrompt(k + 'x' + Date.now()); if (p.id === used) p = PROMPTS[(PROMPTS.findIndex(x => x.id === used) + 1) % PROMPTS.length]; state.parle = { date: k, pid: p.id, text: '', result: null, repeated: false, extra: true }; save(); render(); break; }
    case 'placement-send': { const v = ($('#placeIn') || {}).value || ''; ui.placeText = v; if (v.trim().split(/\s+/).length < 15) { toast('Parle un peu plus longtemps, 2 minutes environ'); break; } TTS.unlock(); assess(v, 'placement'); break; }
    case 'placement-skip': ui.skipPlacement = true; render(); break;
    case 'goto-parle-placement': ui.skipPlacement = false; ui.tab = 'parle'; render(); break;
    case 'weekly-open': ui.weeklyOpen = true; render(); break;
    case 'weekly-close': ui.weeklyOpen = false; render(); break;
    case 'weekly-send': { const v = ($('#weeklyIn') || {}).value || ''; ui.weeklyText = v; if (v.trim().split(/\s+/).length < 15) { toast('Parle un peu plus longtemps'); break; } TTS.unlock(); assess(v, 'weekly'); break; }
    case 'goto-progres': ui.tab = 'progres'; ui.weeklyOpen = true; render(); break;
    case 'goto-ecoute': ui.tab = 'ecoute'; ui.step = {}; render(); break;
    case 'goto-review': { const d = dueWords(); if (!d.length) { toast('Rien à revoir pour l\'instant'); break; } ui.tab = 'mots'; ui.review = { queue: d.map(w => w.key), i: 0 }; ui.step = {}; render(); break; }
    // audio
    case 'say-play': TTS.unlock(); TTS.speak(el.dataset.t, el.dataset.slow ? 0.62 : (state.settings.rate || 1)); break;
    case 'say-words': TTS.unlock(); TTS.words(el.dataset.t); break;
    case 'play': if (line) playLine(line, el.dataset.mode); break;
    // Écouter
    case 'start': TTS.unlock(); t.plan = null; t.step = 0; t.ok = 0; t.total = 0; t.added = 0; ui.pickSit = false; nextStep(); break;
    case 'replay': t.plan = null; t.step = 0; t.ok = 0; t.total = 0; t.added = 0; t.extra = true; ui.step = {}; save(); render(); break;
    case 'pick-sit': ui.pickSit = !ui.pickSit; render(); break;
