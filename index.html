    case 'choose-sit': { const sit = SITS.find(s => s.id === el.dataset.sit); if (sit) { const done = !!(state.days[todayKey()] && state.days[todayKey()].listen); state.listen = newListen(sit, done); ui.pickSit = false; ui.step = {}; save(); render(); } break; }
    case 'next': nextStep(); break;
    case 'reveal': ui.step.revealed = true; render(); break;
    case 'explain': { const box = document.getElementById('explain'); if (box && line) explain(line, box, el); break; }
    case 'grade': t.total++; if (el.dataset.ok === '1') { t.ok++; nextStep(); } else { ui.step.picking = true; ui.step.picked = []; save(); render(); } break;
    case 'pick': { const i = Number(el.dataset.i); const p = ui.step.picked; const k = p.indexOf(i); if (k >= 0) p.splice(k, 1); else p.push(i); render(); break; }
    case 'add-picked': { const toks = line.en.split(/\s+/); let n = 0; const added = []; (ui.step.picked || []).forEach(i => { const w = norm(toks[i]); if (addWord(w, '', line.en, line.fr, 'ecoute')) { n++; added.push(w); } }); t.added += n; if (n) { toast(n + (n > 1 ? ' mots gardés' : ' mot gardé')); fillMeanings(line, added); } nextStep(); break; }
    case 'answer': { const ok = norm(el.dataset.v) === norm(line.gap); ui.step.answered = true; ui.step.ok = ok; ui.step.chosen = el.dataset.v; t.total++; if (ok) t.ok++; else if (addWord(norm(line.gap), '', line.en, line.fr, 'ecoute')) { t.added++; fillMeanings(line, [norm(line.gap)]); } save(); render(); if (!ok) playLine(line, 'slow'); break; }
    case 'pickw': ui.step.picked.push(Number(el.dataset.i)); render(); break;
    case 'unpick': { const p = ui.step.picked; const k = p.indexOf(Number(el.dataset.i)); if (k >= 0) p.splice(k, 1); render(); break; }
    case 'check-order': { const toks = line.en.split(/\s+/); const ok = ui.step.picked.map(i => toks[i]).join(' ') === toks.join(' '); ui.step.answered = true; ui.step.ok = ok; t.total++; if (ok) t.ok++; save(); render(); if (!ok) playLine(line, 'slow'); break; }
    case 'rep': { const h = state.hard.filter(x => x !== line.id); if (el.dataset.ok === '0') h.push(line.id); state.hard = h.slice(-20); nextStep(); break; }
    // Dialogue
    case 'dial-start': TTS.unlock(); startDialogue(el.dataset.id); break;
    case 'dial-other': { const cur = dialForDate(todayKey()).id; const others = DIALOGUES.filter(d => d.id !== cur); TTS.unlock(); startDialogue(others[hash(String(Date.now())) % others.length].id); break; }
    case 'dial-play': { const d = DIALOGUES.find(x => x.id === ui.dial.id); TTS.unlock(); TTS.dialogue(d.lines, el.dataset.mode === 'slow' ? 0.65 : (state.settings.rate || 1)); if (ui.dial.stage === 'listen') { ui.dial.plays++; const b = document.querySelector('[data-action="dial-questions"]'); if (b) b.disabled = false; } break; }
    case 'dial-questions': TTS.stop(); ui.dial.stage = 'q'; ui.dial.qi = 0; ui.dial.chosen = null; render(); break;
    case 'dial-answer': { const u = ui.dial; if (u.chosen != null) break; const d = DIALOGUES.find(x => x.id === u.id); u.chosen = Number(el.dataset.i); if (u.chosen === d.qs[u.qi].a) u.ok++; render(); break; }
    case 'dial-next': { const u = ui.dial; const d = DIALOGUES.find(x => x.id === u.id); if (u.qi + 1 < d.qs.length) { u.qi++; u.chosen = null; render(); } else { u.stage = 'done'; finishDialogue(); render(); const dd = DIALOGUES.find(x => x.id === u.id); TTS.dialogue(dd.lines, state.settings.rate || 1); } break; }
    case 'dial-finish': TTS.stop(); ui.dial = null; render(); toast('Dialogue terminé'); break;
    case 'dial-quit': TTS.stop(); ui.dial = null; render(); break;
    // Quiz éclair
    case 'quiz-start': TTS.unlock(); startQuiz(el.dataset.mode || 'mix'); break;
    case 'quiz-go': TTS.unlock(); ui.tab = 'mots'; ui.review = null; ui.drill = null; ui.vocab.theme = ''; startQuiz(el.dataset.mode || 'convo'); break;
    case 'quiz-quit': ui.quiz = null; render(); break;
    case 'quiz-answer': { const q = ui.quiz; if (!q || q.answered) break; const cur = q.qs[q.i];
      if (cur.type === 'convo') { const it = cur.it; const i = Number(el.dataset.i); const ok = i === it.a; q.answered = true; q.ok = ok; q.chosen = i; state.seen['c:' + it.id] = (state.seen['c:' + it.id] || 0) + 1; if (ok) q.score++; else addWord(it.o[it.a], it.tr, it.q, it.fr, 'convo'); save(); render(); TTS.speak(it.o[it.a], state.settings.rate || 1); break; }
      const ok = el.dataset.id === cur.v.id; q.answered = true; q.ok = ok; q.chosen = el.dataset.id; if (cur.v.theme !== 'mine') state.seen[cur.v.id] = 1; if (ok) q.score++; else { if (cur.v.theme === 'mine') gradeWord(cur.v.key, false); else if (addWord(cur.v.en, cur.v.fr, cur.v.ex, '', 'quiz')) toast('Gardé dans tes mots'); } if (cur.dir === 'fr') TTS.speak(cur.v.en, state.settings.rate || 1); save(); render(); if (ok) setTimeout(() => { if (ui.quiz === q && q.answered) quizNext(); }, 800); break; }
    case 'quiz-next': quizNext(); break;
    case 'dial-pro': { const pros = DIALOGUES.filter(d => d.pro); TTS.unlock(); startDialogue(pros[hash(String(Date.now())) % pros.length].id); break; }
    case 'parle-pro': { const used = {}; Object.values(state.days).forEach(d => { if (d.parle && d.parle.pid) used[d.parle.pid] = (used[d.parle.pid] || 0) + 1; }); const ps = PROMPTS.filter(p => p.g === 'pro'); const min = Math.min(...ps.map(p => used[p.id] || 0)); const c = ps.filter(p => (used[p.id] || 0) === min); const p = c[hash(String(Date.now())) % c.length]; state.parle = { date: todayKey(), pid: p.id, text: '', result: null, repeated: false, extra: !!(state.days[todayKey()] && state.days[todayKey()].parle) }; save(); render(); break; }
    case 'extract-send': { const v = ($('#extractIn') || {}).value || ''; if (v.trim().split(/\s+/).length < 5) { toast('Colle un texte un peu plus long'); break; } extractWords(v); break; }
    case 'extract-keep': { const w = ui.extract.res[Number(el.dataset.i)]; if (!w) break; if (addWord(w.w, w.fr, w.ex, '', 'texte')) { w.kept = true; save(); toast('Gardé'); } else { w.kept = true; toast('Déjà dans tes mots'); } render(); break; }
    case 'extract-keep-all': { let n = 0; ui.extract.res.forEach(w => { if (!w.kept) { if (addWord(w.w, w.fr, w.ex, '', 'texte')) n++; w.kept = true; } }); save(); render(); toast(n + ' mot' + (n > 1 ? 's gardés' : ' gardé')); break; }
    // Mots
    case 'review-start': ui.review = { queue: dueWords().map(w => w.key), i: 0 }; ui.step = {}; render(); break;
    case 'review-stop': ui.review = null; ui.step = {}; render(); break;
    case 'know': gradeWord(el.dataset.k, el.dataset.ok === '1'); if (ui.review) { ui.review.i++; } ui.step = {}; render(); break;
    case 'del-word': delete state.words[el.dataset.k]; save(); render(); break;
    case 'vocab-theme': ui.vocab.theme = el.dataset.theme; render(); break;
    case 'vocab-back': ui.vocab.theme = ''; render(); break;
    case 'vocab-add': { const v = VOCAB_ALL.find(x => x.id === el.dataset.id); if (v && addWord(v.en, v.fr, v.ex, '', 'banque')) { save(); toast('Gardé dans Mes mots'); } else toast('Déjà dans tes mots'); break; }
    case 'drill-start': { const th = VOCAB.find(x => x.id === el.dataset.theme); if (!th) break; ui.drill = { theme: th.id, items: shuffle(VOCAB_ALL.filter(x => x.theme === th.id)).slice(0, 10), i: 0, ok: 0 }; ui.step = {}; render(); break; }
    case 'drill-grade': { const d = ui.drill; if (!d) break; const v = d.items[d.i]; state.seen[v.id] = 1; if (el.dataset.ok === '1') d.ok++; else if (addWord(v.en, v.fr, v.ex, '', 'banque')) toast('Gardé dans Mes mots'); d.i++; ui.step = {}; save(); render(); break; }
    case 'drill-quit': ui.drill = null; ui.step = {}; render(); break;
  }
});

// ---------- capabilities ----------
async function initCaps(){
  if (!(window.claude && typeof window.claude.use === 'function')) return;
  window.claude.use('sample').then(fn => { sampleFn = fn || null; document.getElementById('app').classList.toggle('has-claude', !!fn); if (ui.sheet) renderSheet(); }).catch(() => {});
  window.claude.use('db').then(async db => {
    if (!db) return; const ref = db.doc('progress/main'); let remoteNewer = false;
    try { const snap = await ref.get(); if (snap.exists) { const remote = migrate(JSON.parse(JSON.stringify(snap.data()))); if (remote && (remote.updated || 0) > (state.updated || 0)) { state = remote; remoteNewer = true; try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} ui.step = {}; render(); } } } catch (e) {}
    dbRef = ref; if (!remoteNewer) save();
  }).catch(() => {});
}
ensureParle(); ensureListen(); render(); initCaps();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
