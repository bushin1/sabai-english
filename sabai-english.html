<title>Sabai English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: phone game app — level bar on top, one big gradient "session" card, chunky 3D buttons, 4-tab bar at the thumb. Dark-first "Bangkok night market": indigo ground, coral/teal/mango accents. */
:root{
  --bg:#14122E; --bg2:#1B1840; --card:#232052; --card2:#2D2966; --line:#3B3781; --fg:#F7F5FF; --muted:#ABA7D8; --ink:#1A1033;
  --coral:#FF6B4A; --coral-d:#C24A2F; --teal:#2EE6C5; --teal-d:#17A88E; --sun:#FFD166; --sun-d:#C9982F; --pink:#FF3D81; --violet:#8B5CFF;
  --good:#3DDC97; --good-d:#1F9A66; --good-soft:#1C3E33; --bad:#FF5C7A; --bad-d:#B23A55; --bad-soft:#4A2238;
  --display:'Fredoka','Avenir Next Rounded','Arial Rounded MT Bold',Arial,sans-serif;
  --body:'Nunito',-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F3F1FF; --bg2:#ECE9FF; --card:#FFFFFF; --card2:#EEEBFF; --line:#D9D4F5; --fg:#1E1A3C; --muted:#6B668F; --ink:#1A1033;
    --good-soft:#DDF6EA; --bad-soft:#FFE1E8; --line:#D9D4F5;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F3F1FF; --bg2:#ECE9FF; --card:#FFFFFF; --card2:#EEEBFF; --line:#D9D4F5; --fg:#1E1A3C; --muted:#6B668F; --ink:#1A1033;
  --good-soft:#DDF6EA; --bad-soft:#FFE1E8;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--display);font-weight:600}
p{margin:0}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px;gap:10px}
.lvl{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.lvlbadge{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--sun),var(--coral));color:var(--ink);font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 0 var(--coral-d)}
.lvltxt{min-width:0;flex:1}
.lvltxt b{display:block;font-family:var(--display);font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--sun));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.top-right{display:flex;align-items:center;gap:6px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 11px;border-radius:999px;background:var(--card2);font-family:var(--display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.chip.lit{background:var(--coral);color:#fff}
.iconbtn{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn svg{width:22px;height:22px}

main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 28px}
main > *{min-width:0}

.tabs{display:flex;border-top:1px solid var(--line);background:var(--bg2);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;color:var(--muted);font-family:var(--display);font-size:11.5px;font-weight:500;min-height:54px;justify-content:center}
.tab svg{width:24px;height:24px}
.tab.active{color:var(--teal);background:var(--card)}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:22px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.eyebrow{font-family:var(--display);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow b{color:var(--teal)}
.combo{background:var(--coral);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.prompt{font-size:16px;color:var(--muted)}
.en{font-size:25px;line-height:1.3;font-weight:800;letter-spacing:-.005em;text-wrap:balance}
.en .gapword{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--sun);color:transparent;line-height:1}
.en .hit{background:var(--sun);color:var(--ink);border-radius:8px;padding:0 6px}
.fr{font-size:17px;color:var(--muted)}
.say{font-size:15px;background:var(--card2);border-radius:14px;padding:10px 12px}
.say .lbl,.tip .lbl{display:block;font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:3px}
.tip{font-size:15px;border-left:3px solid var(--sun);padding:4px 0 4px 12px}
.note{font-size:14px;color:var(--muted)}
.lead{font-size:17px;line-height:1.5}

.btn{--sh:var(--line);display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 18px;border-radius:18px;font-family:var(--display);font-weight:600;font-size:17px;width:100%;box-shadow:0 5px 0 var(--sh);transition:transform .06s,box-shadow .06s;background:var(--card2);color:var(--fg)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sh)}
.btn.sun{background:var(--sun);color:var(--ink);--sh:var(--sun-d)}
.btn.coral{background:var(--coral);color:#fff;--sh:var(--coral-d)}
.btn.teal{background:var(--teal);color:var(--ink);--sh:var(--teal-d)}
.btn.good{background:var(--good);color:var(--ink);--sh:var(--good-d)}
.btn.bad{background:var(--bad);color:#fff;--sh:var(--bad-d)}
.btn.ghost{background:var(--card2);color:var(--fg);--sh:var(--line)}
.btn.line{background:transparent;border:2px solid var(--line);box-shadow:none}
.btn.line:active{transform:scale(.97)}
.btn.small{min-height:42px;font-size:14px;width:auto;padding:0 14px;box-shadow:0 3px 0 var(--sh)}
.btn.small:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sh)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:20px;height:20px;flex:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.playrow{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0}
.play{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 var(--coral-d),0 14px 30px -10px var(--pink);transition:transform .06s,box-shadow .06s}
.play:active{transform:translateY(5px);box-shadow:0 1px 0 var(--coral-d)}
.play svg{width:36px;height:36px;margin-left:4px}
.bars{display:none;align-items:flex-end;gap:3px;height:30px}
.bars i{display:block;width:6px;background:currentColor;border-radius:3px;animation:bar .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}
.play.playing .bars{display:flex}.play.playing .tri{display:none}
@keyframes bar{0%,100%{height:8px}50%{height:28px}}
@media (prefers-reduced-motion:reduce){.bars i{animation:none;height:16px}.combo{animation:none}}
.speedrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.speedrow .btn{width:auto;min-height:40px;font-size:14px;padding:0 14px;box-shadow:0 3px 0 var(--sh)}
.speedrow .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sh)}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:56px;border-radius:16px;font-family:var(--display);font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:8px 14px;background:var(--card2);box-shadow:0 4px 0 var(--line);transition:transform .06s,box-shadow .06s;text-align:center;line-height:1.25}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.right{background:var(--good);color:var(--ink);box-shadow:0 4px 0 var(--good-d)}
.opt.wrong{background:var(--bad);color:#fff;box-shadow:0 4px 0 var(--bad-d)}
.opt[disabled]{opacity:.45;pointer-events:none}
.opt.right[disabled],.opt.wrong[disabled]{opacity:1}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.opts.grid .opt{font-size:16px;min-height:64px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipw{min-height:44px;padding:0 14px;border-radius:14px;font-family:var(--display);font-size:17px;font-weight:500;background:var(--card2);box-shadow:0 3px 0 var(--line)}
.chipw:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.chipw.on{background:var(--teal);color:var(--ink);box-shadow:0 3px 0 var(--teal-d)}
.answer{min-height:62px;border:2px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.answer.ok{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.answer.ko{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.answer:empty::before{content:"Tape les mots dans l'ordre";color:var(--muted);font-size:14px;padding-left:6px}
.verdict{font-family:var(--display);font-weight:600;font-size:18px}
.verdict.ok{color:var(--good)}.verdict.ko{color:var(--bad)}

.progress{display:flex;gap:4px;margin:4px 0 12px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--card2)}
.progress i.done{background:var(--teal)}
.progress i.cur{background:var(--sun)}

.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px;color:#fff;background:linear-gradient(135deg,#FF6B4A 0%,#FF3D81 55%,#8B5CFF 100%);display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 40px -18px #FF3D81}
.hero::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14);right:-70px;top:-90px}
.hero::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1);left:-50px;bottom:-70px}
.hero > *{position:relative}
.hero .kicker{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.hero h1{font-size:28px;line-height:1.1;font-weight:700;color:#fff}
.hero .lead{opacity:.95;font-size:16px}
.hero .meta{font-family:var(--display);font-size:13px;opacity:.9;display:flex;gap:12px;flex-wrap:wrap}
.hero .btn{margin-top:4px}
.page-h1{font-size:28px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left;box-shadow:0 4px 0 var(--line);transition:transform .06s,box-shadow .06s;min-height:96px}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile .ico{font-size:26px;line-height:1}
.tile b{font-family:var(--display);font-weight:600;font-size:16px}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.sun{background:var(--sun);color:var(--ink);border-color:transparent;box-shadow:0 4px 0 var(--sun-d)}
.tile.sun span{color:var(--ink);opacity:.75}
.tile .pbar{height:5px;border-radius:3px;background:var(--bg2);overflow:hidden;margin-top:6px}
.tile .pbar i{display:block;height:100%;background:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.sect{font-family:var(--display);font-size:17px;font-weight:600;margin-top:4px;display:flex;justify-content:space-between;align-items:baseline}
.sect small{font-size:12.5px;color:var(--muted);font-weight:500}
.trophies{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.trophies::-webkit-scrollbar{display:none}
.trophy{flex:none;width:92px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.trophy .ico{font-size:28px;line-height:1;filter:grayscale(1);opacity:.35}
.trophy.on .ico{filter:none;opacity:1}
.trophy.on{border-color:var(--sun)}
.trophy span{font-size:11px;line-height:1.2;color:var(--muted)}
.trophy.on span{color:var(--fg)}
.explain{font-size:15px;line-height:1.5;background:var(--card2);border-radius:14px;padding:12px 14px;white-space:pre-wrap}
.explain:empty{display:none}
.needs-claude{display:none}.has-claude .needs-claude{display:flex}
.no-claude{display:block}.has-claude .no-claude{display:none}
.has-claude .needs-claude.block{display:block}

textarea,select,input[type=text]{width:100%;font:inherit;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;min-height:52px}
textarea{min-height:84px;resize:vertical;font-size:17px}
select{appearance:none;-webkit-appearance:none}

.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.item .txt{flex:1;min-width:0}
.item .w{font-size:17px;font-weight:800}
.item .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mini{width:44px;height:44px;border-radius:13px;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--fg);box-shadow:0 3px 0 var(--line)}
.item .mini:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.item .mini svg{width:20px;height:20px}
.item .mini.acc{background:var(--teal);color:var(--ink);box-shadow:0 3px 0 var(--teal-d)}
.badge{font-family:var(--display);font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--muted);flex:none}
.badge.due{background:var(--sun);color:var(--ink)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chipw{flex:none;font-size:14px;min-height:38px}
.empty{color:var(--muted);font-size:15px;text-align:center;padding:16px 8px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timer{display:flex;align-items:center;gap:10px}
.timer .tbar{flex:1;height:10px;border-radius:5px;background:var(--card2);overflow:hidden}
.timer .tbar i{display:block;height:100%;background:var(--sun);transition:width 1s linear}
.timer .tbar i.hot{background:var(--coral)}
.timer b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right}
.score{font-family:var(--display);font-size:46px;font-weight:700;line-height:1;text-align:center}
.score small{display:block;font-size:14px;color:var(--muted);font-weight:500;margin-top:6px}
.big-ico{font-size:54px;text-align:center;line-height:1}

.sheet-bg{position:fixed;inset:0;background:rgba(10,8,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--display);font-size:13px;font-weight:600;color:var(--muted)}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:11px;font-family:var(--display);font-weight:500;font-size:14px}
.seg button.on{background:var(--teal);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-family:var(--display);font-size:14px;font-weight:600;z-index:20;max-width:90%;text-align:center}
.xpfloat{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:30px;color:var(--sun);text-shadow:0 2px 0 var(--sun-d);z-index:21;pointer-events:none;animation:xpf 1.1s ease-out forwards}
@keyframes xpf{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
@media (prefers-reduced-motion:reduce){.xpfloat{animation:none;opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wotd{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--line)}
.sitpick{gap:10px}
</style>

<div id="app">
  <header class="top">
    <div class="lvl" data-action="open-settings">
      <div class="lvlbadge" id="lvlN">1</div>
      <div class="lvltxt"><b id="lvlT">Fresh off the plane</b><div class="xpbar"><i id="xpBar" style="width:0%"></i></div></div>
    </div>
    <div class="top-right">
      <button class="chip" id="streakChip" data-action="open-settings" aria-label="Série de jours">🔥 <b id="streakN">0</b></button>
      <button class="iconbtn" data-action="open-settings" aria-label="Réglages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="tabs" aria-label="Onglets">
    <button class="tab active" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      Aujourd'hui
    </button>
    <button class="tab" data-tab="vocab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
      Vocab
    </button>
    <button class="tab" data-tab="say">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.1A8 8 0 1 1 21 12z"/></svg>
      Dire
    </button>

{id:'bar',title:'Bar et soirée',ctx:"L'anglais des voyageurs : Anglais, Australiens. Rapide, relâché, plein de « mate ».",lines:[

{id:'gym',title:'Salle de sport',ctx:"Partager les machines sans se prendre la tête.",lines:[

]}

{id:'airport',title:'Aéroport',ctx:"Contrôles, porte, embarquement. Les annonces et les agents vont vite.",lines:[

{id:'island',title:'Îles et bateaux',ctx:"Longtail, ferry, snorkeling. Le capitaine crie par-dessus le moteur.",lines:[

// ---------- utils ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = t => String(t).toLowerCase().replace(/^[^a-z0-9'’-]+|[^a-z0-9'’-]+$/g, '');
function hash(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return Math.abs(h); }
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, seed){ const r = seed == null ? Math.random : rng(seed); const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayKey = () => fmtDate(new Date());
function addDays(key, n){ const [y, m, d] = key.split('-').map(Number); return fmtDate(new Date(y, m - 1, d + n)); }
const INTERVALS = [0, 1, 3, 7, 14, 30];
const VOCAB_ALL = VOCAB.flatMap(t => t.items.map((it, i) => ({ id: t.id + ':' + i, theme: t.id, en: it[0], fr: it[1], ex: it[2] })));

// ---------- state ----------
const KEY = 'sabai.v1';
function fresh(){ return { v: 2, updated: 0, settings: { voice: 'auto', rate: 1, sound: true }, streak: { count: 0, last: null }, days: {}, words: {}, hard: [], today: null, xp: 0, badges: [], blitzBest: 0, sessions: 0, seen: {} }; }
function migrate(s){
  if (!s || typeof s !== 'object') return null;
  if (s.v === 1) { s.v = 2; s.xp = 0; s.badges = []; s.blitzBest = 0; s.sessions = Object.keys(s.days || {}).length; s.seen = {}; s.settings = s.settings || {}; if (s.settings.sound == null) s.settings.sound = true; if (s.today) s.today = null; }

}
function load(){ try { return migrate(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) {} return null; }
let state = load() || fresh();

let sampleFn = null, dbRef = null, dbTimer = null, dbChain = Promise.resolve();

function save(){

function addXP(n, silent){

}
function floatXP(n){

// ---------- sound effects ----------
const FX = {
  ctx: null,
  get(){ if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} } return this.ctx; },
  tone(f, t0, dur, type, g){
    if (!state.settings.sound) return; const c = this.get(); if (!c) return;
    try {
      const o = c.createOscillator(), gn = c.createGain(); o.type = type || 'sine'; o.frequency.value = f;
      const t = c.currentTime + t0; gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(g || 0.12, t + 0.012); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(gn).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  },
  good(){ this.tone(523, 0, 0.12); this.tone(784, 0.09, 0.2); },
  bad(){ this.tone(200, 0, 0.18, 'sawtooth', 0.05); this.tone(160, 0.12, 0.25, 'sawtooth', 0.05); },
  win(){ [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * 0.09, 0.28)); },
  tick(){ this.tone(1300, 0, 0.04, 'square', 0.035); },
  pop(){ this.tone(900, 0, 0.06, 'triangle', 0.07); }
};

// ---------- confetti ----------
let fxAnim = null;
function confetti(big){
  if (reduced()) return;
  const cv = document.getElementById('fx'); if (!cv) return;
  const ctx = cv.getContext('2d'); const W = cv.width = innerWidth, H = cv.height = innerHeight; cv.hidden = false;
  const colors = ['#FF6B4A', '#2EE6C5', '#FFD166', '#FF3D81', '#8B5CFF', '#3DDC97'];
  const n = big ? 140 : 40; const ps = [];
  for (let i = 0; i < n; i++) ps.push({ x: W / 2 + (Math.random() - .5) * (big ? 200 : 120), y: big ? H * 0.45 : H * 0.38, vx: (Math.random() - .5) * (big ? 16 : 9), vy: -Math.random() * (big ? 16 : 10) - 4, s: 5 + Math.random() * 6, c: colors[i % colors.length], r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, life: 0 });
  cancelAnimationFrame(fxAnim);
  const t0 = performance.now();
  const frame = now => {
    ctx.clearRect(0, 0, W, H); let alive = 0;
    for (const p of ps) { p.vy += 0.45; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.r += p.vr; if (p.y < H + 20) alive++; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - (now - t0) / (big ? 2200 : 1300)); ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); ctx.restore(); }
    if (alive && now - t0 < (big ? 2200 : 1300)) fxAnim = requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
  };
  fxAnim = requestAnimationFrame(frame);
}

// ---------- speech ----------
const TTS = {
  voices: [],
  ok(){ return 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window; },
  refresh(){ try { this.voices = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)); } catch (e) { this.voices = []; } },
  pick(){
    const pref = state.settings.voice;
    if (pref && pref !== 'auto') { const v = this.voices.find(v => v.name === pref); if (v) return v; }
    const order = ['Samantha', 'Ava', 'Allison', 'Nicky', 'Zoe', 'Daniel', 'Karen', 'Google US English', 'Google UK English Female', 'Microsoft Aria', 'Microsoft Jenny', 'Microsoft Zira'];
    for (const n of order) { const v = this.voices.find(v => v.name.startsWith(n)); if (v) return v; }
    return this.voices.find(v => v.lang === 'en-US') || this.voices[0] || null;
  },
  utter(text, rate){
    const u = new SpeechSynthesisUtterance(text);
    const v = this.pick(); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
    u.rate = rate; u.pitch = 1;
    u.onstart = () => setPlaying(true); u.onend = () => setPlaying(false); u.onerror = () => setPlaying(false);
    return u;
  },
  speak(text, rate){
    if (!this.ok()) { toast('Pas de synthèse vocale sur ce navigateur'); return; }
    try { speechSynthesis.cancel(); speechSynthesis.speak(this.utter(text, rate)); } catch (e) { setPlaying(false); }
  },
  words(text){
    if (!this.ok()) { toast('Pas de synthèse vocale sur ce navigateur'); return; }
    try { speechSynthesis.cancel(); text.split(/\s+/).map(w => w.replace(/^[^\w'’]+|[^\w'’]+$/g, '')).filter(Boolean).forEach(w => speechSynthesis.speak(this.utter(w, 0.85))); } catch (e) { setPlaying(false); }
  },
  stop(){ try { speechSynthesis.cancel(); } catch (e) {} setPlaying(false); },
  unlock(){ if (this.ok()) { try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {} } FX.get(); }
};
if (TTS.ok()) { TTS.refresh(); speechSynthesis.onvoiceschanged = () => { TTS.refresh(); if (ui.sheet) renderSheet(); }; }
function setPlaying(on){ document.querySelectorAll('.play').forEach(b => b.classList.toggle('playing', on)); }
function playLine(line, mode){
  const rate = state.settings.rate || 1;
  if (mode === 'slow') TTS.speak(line.en, 0.62);
  else if (mode === 'words') TTS.words(line.en);
  else TTS.speak(line.say || line.en, rate);
}

// ---------- session ----------
function sitForDate(key){
  const counts = {}; SITS.forEach(s => counts[s.id] = 0);
  Object.values(state.days).forEach(d => { if (counts[d.sit] != null) counts[d.sit]++; });
  const min = Math.min(...Object.values(counts));
  const cands = SITS.filter(s => counts[s.id] === min);
  return cands[hash(key) % cands.length];
}
function dueWords(){ const k = todayKey(); return Object.values(state.words).filter(w => w.due <= k).sort((a, b) => a.box - b.box); }
function ensureToday(){
  const k = todayKey();
  if (!state.today || state.today.date !== k) {
    const sit = sitForDate(k);
    state.today = { date: k, sit: sit.id, title: sit.title, ctx: sit.ctx, lines: null, plan: null, step: 0, ok: 0, total: 0, added: 0, extra: false };
    save();
  }
}
function sessionLines(){
  const t = state.today; if (t.lines) return t.lines;
  const sit = SITS.find(s => s.id === t.sit) || SITS[0];
  return sit.lines.map((l, i) => ({ ...l, id: sit.id + '-' + i }));
}
function gapIndex(line){ const toks = line.en.split(/\s+/); const i = toks.findIndex(t => norm(t) === norm(line.gap)); return i >= 0 ? { i, toks } : null; }
function buildPlan(){
  const lines = sessionLines(); const plan = [{ t: 'intro' }];
  const types = ['listen', 'gap', 'order', 'listen', 'gap', 'order'];
  lines.forEach((l, i) => { let t = types[i % types.length]; const n = l.en.split(/\s+/).length; if (t === 'order' && (n > 8 || n < 3)) t = 'gap'; if (t === 'gap' && !gapIndex(l)) t = 'listen'; plan.push({ t, i }); });
  const hardHere = lines.map((l, i) => i).filter(i => state.hard.includes(lines[i].id));
  [...new Set([...hardHere, 0, Math.min(3, lines.length - 1)])].slice(0, 2).forEach(i => plan.push({ t: 'repeat', i }));
  const due = dueWords().slice(0, 6).map(w => w.key); if (due.length) plan.push({ t: 'review', words: due });
  plan.push({ t: 'done' }); return plan;
}
function currentStep(){ const t = state.today; if (!t.plan) return { t: 'intro' }; return t.plan[Math.min(t.step, t.plan.length - 1)]; }
function next(){
  const t = state.today;
  if (!t.plan) { t.plan = buildPlan(); t.step = 1; } else t.step = Math.min(t.step + 1, t.plan.length - 1);
  ui.step = {}; save();
  if (currentStep().t === 'done') finishDay();
  render();
  const st = currentStep();
  if (st.t === 'gap' || st.t === 'listen') playLine(sessionLines()[st.i], 'normal');
}
function finishDay(){
  const t = state.today; const k = t.date;
  state.sessions = (state.sessions || 0) + 1;
  if (!t.extra && !state.days[k]) {
    state.days[k] = { sit: t.sit, ok: t.ok, total: t.total };
    const y = addDays(k, -1);
    if (state.streak.last === y) state.streak.count += 1; else if (state.streak.last !== k) state.streak.count = 1;
    state.streak.last = k;
    addXP(50, true);
  } else addXP(20, true);
  save(); FX.win(); confetti(true); checkBadges();
}
function addWord(w, line){
  const key = norm(w).replace(/[^a-z0-9'-]/g, '');
  if (!key || state.words[key]) return false;
  state.words[key] = { key, w: norm(w), fr: '', ex: line.en, exfr: line.fr, box: 1, due: todayKey(), added: todayKey() };
  return true;
}
function addVocabWord(v){
  const key = norm(v.en).replace(/[^a-z0-9'\-\s/.…]/g, '').replace(/\s+/g, '-').slice(0, 40);
  if (!key) return false; if (state.words[key]) return false;
  state.words[key] = { key, w: v.en, fr: v.fr, ex: v.ex, exfr: '', box: 1, due: todayKey(), added: todayKey() };
  return true;
}
function gradeWord(key, known){
  const w = state.words[key]; if (!w) return;
  w.box = known ? Math.min(w.box + 1, INTERVALS.length - 1) : 1;
  w.due = addDays(todayKey(), INTERVALS[w.box]); save();
}
function hit(ok){
  if (ok) { ui.combo++; FX.good(); buzz(15); if (ui.combo >= 3 && ui.combo % 3 === 0) { addXP(15); toast('Combo x' + ui.combo + ' !'); confetti(false); } else addXP(10); if (!reduced() && ui.combo >= 2) confetti(false); }
  else { ui.combo = 0; FX.bad(); buzz(60); }
}

function makeQuestion(v, dir){

function startBlitz(themeId){

// ---------- Claude ----------
const LEVEL = "Marvin est français, niveau A2 (anglais faible), il vit en Thaïlande. Il comprend à l'écrit mais quand on parle vite il rate des mots. Explique en français, simple, tutoiement, sans blabla.";
async function explain(line, box, btn){
  if (!sampleFn) return; btn.disabled = true; box.textContent = 'Claude réfléchit…';
  try {
    const { text } = await sampleFn(`${LEVEL}\nPhrase anglaise : "${line.en}"\nTraduction : "${line.fr}"\nEn 3 phrases courtes max : (1) le sens exact et dans quel contexte on l'entend, (2) ce qui est dur à entendre à vitesse normale (mots avalés, liaisons, contractions), (3) un truc concret pour la reconnaître la prochaine fois. Pas de titre, pas de liste.`, { modelTier: 'quick', onText: ({ text }) => { box.textContent = text; } });
    box.textContent = text;
  } catch (e) {
    box.textContent = e && e.text ? e.text : '';
    if (e && e.code === 'not_granted') document.getElementById('app').classList.remove('has-claude');
    else if (e && e.code === 'rate_limited') toast('Trop de demandes, réessaie dans un moment');
    else if (e && e.code !== 'cancelled') toast('Claude n\'a pas répondu');
  } finally { btn.disabled = false; }
}
let genCtl = null;
async function generate(sitId, free){
  if (!sampleFn) return;
  const sit = SITS.find(s => s.id === sitId);
  const desc = free ? free : sit ? `${sit.title} (${sit.ctx})` : SITS[hash(String(Date.now())) % SITS.length].title;
  ui.step.genBusy = true; ui.step.genErr = ''; render(); genCtl = new AbortController();
  try {
    const data = await sampleFn.json(`${LEVEL}\nGénère 6 répliques courtes (3 à 9 mots) en anglais parlé que Marvin peut ENTENDRE dans cette situation en Thaïlande : ${desc}. Réalistes, naturelles, vocabulaire courant, niveau A2. Mélange des phrases dites par l'autre personne et une ou deux que Marvin dirait lui-même.\nRéponds UNIQUEMENT avec un JSON array de 6 objets, exemple :\n[{"en":"Do you want a bag?","say":"D'you want a bag?","fr":"Tu veux un sac ?","tip":"« Do you » se dit très vite, ça sonne « dju ».","gap":"bag","alts":["back","bank"]}]\nRègles : "en" = phrase anglaise correcte avec ponctuation ; "say" = la même phrase écrite comme elle sonne vite (wanna, gonna, gotta, ya…) ou identique à "en" ; "fr" = traduction naturelle en français familier ; "tip" = 1 phrase en français sur ce qui est dur à entendre ; "gap" = un mot important de "en", écrit exactement comme dans "en" sans ponctuation ; "alts" = 2 mots anglais qui sonnent presque pareil que "gap" mais différents.`, { modelTier: 'default', cache: false, signal: genCtl.signal });
    const lines = (Array.isArray(data) ? data : []).map((x, i) => ({ id: 'gen-' + Date.now() + '-' + i, en: String(x.en || '').trim(), say: x.say ? String(x.say).trim() : '', fr: String(x.fr || '').trim(), tip: x.tip ? String(x.tip).trim() : '', gap: String(x.gap || '').trim(), alts: Array.isArray(x.alts) ? x.alts.slice(0, 2).map(String) : [] }))
      .filter(l => l.en && l.fr).map(l => { if (!gapIndex(l)) { const toks = l.en.split(/\s+/).filter(t => norm(t).length > 3); l.gap = toks.length ? norm(toks[toks.length - 1]) : norm(l.en.split(/\s+/)[0]); } if (l.alts.length < 2) l.alts = [...l.alts, 'maybe', 'never'].slice(0, 2); return l; }).slice(0, 6);
    if (lines.length < 3) throw { code: 'invalid_json' };
    const t = state.today;
    state.today = { date: t.date, sit: sit ? sit.id : 'gen', title: free || (sit ? sit.title : 'Surprise'), ctx: 'Session générée par Claude.', lines, plan: null, step: 0, ok: 0, total: 0, added: 0, extra: true };
    ui.step = {}; save(); render();
  } catch (e) {
    ui.step.genBusy = false;
    if (e && e.code === 'cancelled') ui.step.genOpen = false;
    else if (e && e.code === 'not_granted') { document.getElementById('app').classList.remove('has-claude'); ui.step.genOpen = false; }
    else if (e && e.code === 'rate_limited') ui.step.genErr = 'Trop de demandes pour le moment. Réessaie dans quelques minutes.';
    else ui.step.genErr = 'Claude n\'a pas réussi cette fois. Réessaie, ou change la situation.';
    render();
  }
}
async function translate(q){
  if (!sampleFn) return; ui.say = { q, busy: true, group: (ui.say || {}).group }; render();
  try {
    const x = await sampleFn.json(`${LEVEL}\nMarvin veut dire en anglais, à l'oral, en Thaïlande : "${q}"\nRéponds UNIQUEMENT avec un objet JSON : {"en": "la version la plus simple et naturelle à l'oral", "alt": "une autre façon courante de le dire, ou vide", "say": "la phrase 'en' écrite comme elle sonne vite (wanna, gonna…) ou identique", "note": "1 phrase en français : quand l'utiliser ou le piège à éviter", "words": [{"w": "mot anglais clé", "fr": "son sens"}]} avec 1 à 3 mots dans "words".`, { modelTier: 'quick' });
    if (!x || !x.en) throw { code: 'invalid_json' };
    ui.say = { q, res: x, group: (ui.say || {}).group }; render(); TTS.speak(String(x.en), state.settings.rate || 1);
  } catch (e) {
    const msg = e && e.code === 'not_granted' ? 'Claude n\'est pas autorisé sur cette page.' : e && e.code === 'rate_limited' ? 'Trop de demandes, réessaie dans un moment.' : 'Claude n\'a pas réussi. Réessaie avec une phrase plus courte.';
    if (e && e.code === 'not_granted') document.getElementById('app').classList.remove('has-claude');
    ui.say = { q, err: msg, group: (ui.say || {}).group }; render();
  }
}
async function fillMeanings(line, words){
  if (!sampleFn || !words.length) return;
  try {
    const arr = await sampleFn.json(`Dans la phrase anglaise "${line.en}" (en français : "${line.fr}"), donne le sens en français de ces mots : ${JSON.stringify(words)}. Réponds UNIQUEMENT avec un JSON array [{"w":"mot","fr":"sens court en français"}].`, { modelTier: 'quick' });
    if (Array.isArray(arr)) { arr.forEach(x => { const k = norm(x.w).replace(/[^a-z0-9'-]/g, ''); if (state.words[k] && !state.words[k].fr) state.words[k].fr = String(x.fr || '').slice(0, 60); }); save(); if (ui.tab === 'words') render(); }
  } catch (e) {}
}

// ---------- events ----------
document.addEventListener('change', e => { if (e.target.id === 'voiceSel') { state.settings.voice = e.target.value; save(); } });
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { if (ui.blitz && !ui.blitz.done) { clearInterval(ui.blitz.timer); } ui.blitz = null; ui.quiz = null; ui.tab = tab.dataset.tab; ui.step = {}; TTS.stop(); render(); return; }
  const el = e.target.closest('[data-action]'); if (!el) return;
  if (el.dataset.action === 'close-settings' && e.target.closest('[data-stop]') && !e.target.closest('.btn')) return;
  const a = el.dataset.action;
  const t = state.today; const lines = t ? sessionLines() : []; const st = t ? currentStep() : null; const line = st && st.i != null ? lines[st.i] : null;
  switch (a) {
    case 'open-settings': ui.sheet = true; ui.confirmReset = false; renderSheet(); break;
    case 'close-settings': ui.sheet = false; ui.confirmReset = false; $('#overlay').innerHTML = ''; break;
    case 'set-rate': state.settings.rate = Number(el.dataset.v); save(); renderSheet(); break;
    case 'set-sound': state.settings.sound = el.dataset.v === '1'; save(); renderSheet(); if (state.settings.sound) FX.good(); break;
    case 'test-voice': TTS.unlock(); TTS.speak('Hello Marvin. How are you going today?', state.settings.rate || 1); break;
    case 'reset': ui.confirmReset = true; renderSheet(); break;
    case 'reset-no': ui.confirmReset = false; renderSheet(); break;
    case 'reset-yes': state = fresh(); ui = { tab: 'today', step: {}, sheet: false, combo: 0, vocab: {}, quiz: null, blitz: null }; save(); render(); toast('Remis à zéro'); break;
    case 'start': TTS.unlock(); t.plan = null; t.step = 0; t.ok = 0; t.total = 0; t.added = 0; ui.combo = 0; next(); break;
    case 'replay': t.plan = null; t.step = 0; t.ok = 0; t.total = 0; t.added = 0; t.extra = true; ui.step = {}; ui.combo = 0; save(); render(); break;
    case 'next': next(); break;
    case 'play': if (line) playLine(line, el.dataset.mode); break;
    case 'play-word': TTS.unlock(); TTS.speak(el.dataset.w, 0.9); break;
    case 'say-play': TTS.unlock(); TTS.speak(el.dataset.t, el.dataset.slow ? 0.62 : (state.settings.rate || 1)); break;
    case 'reveal': ui.step.revealed = true; render(); break;
    case 'explain': { const box = document.getElementById('explain'); if (box && line) explain(line, box, el); break; }
    case 'grade': t.total++; if (el.dataset.ok === '1') { t.ok++; hit(true); next(); } else { hit(false); ui.step.picking = true; ui.step.picked = []; save(); render(); } break;
    case 'pick': { const i = Number(el.dataset.i); const p = ui.step.picked; const k = p.indexOf(i); if (k >= 0) p.splice(k, 1); else p.push(i); FX.pop(); render(); break; }
    case 'add-picked': { const toks = line.en.split(/\s+/); let n = 0; (ui.step.picked || []).forEach(i => { if (addWord(toks[i], line)) n++; }); t.added += n; if (n) { toast(n + (n > 1 ? ' mots gardés' : ' mot gardé')); fillMeanings(line, (ui.step.picked || []).map(i => norm(toks[i]))); } next(); break; }
    case 'answer': { const ok = norm(el.dataset.v) === norm(line.gap); ui.step.answered = true; ui.step.ok = ok; ui.step.chosen = el.dataset.v; t.total++; if (ok) t.ok++; else if (addWord(line.gap, line)) { t.added++; fillMeanings(line, [norm(line.gap)]); } hit(ok); save(); render(); if (!ok) playLine(line, 'slow'); break; }
    case 'pickw': ui.step.picked.push(Number(el.dataset.i)); FX.pop(); render(); break;
    case 'unpick': { const p = ui.step.picked; const k = p.indexOf(Number(el.dataset.i)); if (k >= 0) p.splice(k, 1); render(); break; }
    case 'check-order': { const toks = line.en.split(/\s+/); const ok = ui.step.picked.map(i => toks[i]).join(' ') === toks.join(' '); ui.step.answered = true; ui.step.ok = ok; t.total++; if (ok) t.ok++; hit(ok); save(); render(); if (!ok) playLine(line, 'slow'); break; }
    case 'rep': { const h = state.hard.filter(x => x !== line.id); if (el.dataset.ok === '0') h.push(line.id); else addXP(5); state.hard = h.slice(-20); next(); break; }
    case 'know': { const known = el.dataset.ok === '1'; gradeWord(el.dataset.k, known); if (known) { FX.good(); addXP(5); } else FX.bad(); if (ui.review) { ui.review.i++; ui.step = {}; render(); } else { ui.step.idx = (ui.step.idx || 0) + 1; ui.step.revealed = false; render(); } break; }
    case 'goto-review': { const d = dueWords(); if (!d.length) { toast('Rien à réviser pour l\'instant'); break; } ui.tab = 'words'; ui.review = { queue: d.map(w => w.key), i: 0 }; ui.step = {}; render(); break; }
    case 'review-start': ui.review = { queue: dueWords().map(w => w.key), i: 0 }; ui.step = {}; render(); break;
    case 'review-stop': ui.review = null; ui.step = {}; render(); break;
    case 'del-word': delete state.words[el.dataset.k]; save(); render(); break;
    case 'gen-open': ui.step.genOpen = !ui.step.genOpen; render(); break;
    case 'gen-go': { const sel = document.getElementById('genSit'); const free = (document.getElementById('genFree') || {}).value || ''; generate(sel ? sel.value : '', free.trim()); break; }
    case 'gen-stop': if (genCtl) genCtl.abort(); break;
    case 'translate': { const q = ($('#sayIn') || {}).value || ''; if (q.trim().length < 2) { toast('Écris d\'abord ta phrase'); break; } TTS.unlock(); translate(q.trim()); break; }
    case 'say-group': ui.say = { ...(ui.say || {}), group: el.dataset.g, q: ($('#sayIn') || {}).value || (ui.say || {}).q }; render(); break;
    case 'say-add': { const key = norm(el.dataset.w).replace(/[^a-z0-9'-]/g, ''); if (key && !state.words[key]) { state.words[key] = { key, w: norm(el.dataset.w), fr: el.dataset.fr || '', ex: el.dataset.en, exfr: el.dataset.exfr || '', box: 1, due: todayKey(), added: todayKey() }; save(); FX.pop(); toast('Gardé dans mes mots'); } else toast('Déjà dans tes mots'); break; }
    case 'vocab-theme': ui.vocab.theme = el.dataset.theme; render(); break;
    case 'vocab-back': ui.vocab.theme = ''; render(); break;
    case 'vocab-add': { const v = VOCAB_ALL.find(x => x.id === el.dataset.id); if (v && addVocabWord(v)) { save(); FX.pop(); toast('Gardé dans mes mots'); } else toast('Déjà dans tes mots'); break; }
    case 'quiz-start': TTS.unlock(); startQuiz(el.dataset.theme); break;
    case 'quiz-quit': ui.quiz = null; render(); break;
    case 'quiz-answer': { const q = ui.quiz; if (!q || q.answered) break; const cur = q.qs[q.i]; const ok = el.dataset.id === cur.v.id; q.answered = true; q.ok = ok; q.chosen = el.dataset.id; state.seen[cur.v.id] = 1; if (ok) { q.score++; hit(true); addXP(0); } else { hit(false); if (addVocabWord(cur.v)) toast('Gardé dans mes mots'); } if (cur.dir === 'fr') TTS.speak(cur.v.en, state.settings.rate || 1); save(); render(); if (ok) setTimeout(() => { if (ui.quiz === q && q.answered) quizNext(); }, 900); break; }
    case 'quiz-next': quizNext(); break;
    case 'blitz-open': TTS.unlock(); ui.tab = 'vocab'; ui.quiz = null; startBlitz(el.dataset.theme || ''); break;
    case 'blitz-answer': { const b = ui.blitz; if (!b || b.answered || b.done) break; const ok = el.dataset.id === b.q.v.id; b.answered = true; b.chosen = el.dataset.id; state.seen[b.q.v.id] = 1; if (ok) { b.score++; ui.combo++; FX.good(); buzz(10); } else { ui.combo = 0; FX.bad(); buzz(50); addVocabWord(b.q.v); } render(); setTimeout(() => { const bb = ui.blitz; if (!bb || bb.done || bb !== b) return; b.i++; blitzQ(); render(); }, ok ? 320 : 900); break; }
    case 'blitz-quit': if (ui.blitz) { clearInterval(ui.blitz.timer); if (!ui.blitz.done && ui.blitz.score) { endBlitz(); break; } } ui.blitz = null; render(); break;
  }
});
function quizNext(){
  const q = ui.quiz; if (!q) return; q.i++; q.answered = false;
  if (q.i >= q.qs.length) { q.done = true; addXP(q.score * 5, true); if (q.score >= 8) confetti(true); FX.win(); save(); checkBadges(); render(); return; }
  render(); const cur = q.qs[q.i]; if (cur.dir === 'en') TTS.speak(cur.v.en, state.settings.rate || 1);
}

// ---------- capabilities ----------
async function initCaps(){
  if (!(window.claude && typeof window.claude.use === 'function')) return;
  window.claude.use('sample').then(fn => { sampleFn = fn || null; document.getElementById('app').classList.toggle('has-claude', !!fn); if (ui.sheet) renderSheet(); }).catch(() => {});
  window.claude.use('db').then(async db => {
    if (!db) return; const ref = db.doc('progress/main'); let remoteNewer = false;
    try { const snap = await ref.get(); if (snap.exists) { const remote = migrate(JSON.parse(JSON.stringify(snap.data()))); if (remote && (remote.updated || 0) > (state.updated || 0)) { state = remote; remoteNewer = true; try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} ui.step = {}; render(); } } } catch (e) {}
    dbRef = ref; if (!remoteNewer) save();
  }).catch(() => {});
}
window.addEventListener('resize', () => { const cv = document.getElementById('fx'); if (cv && !cv.hidden) { cv.width = innerWidth; cv.height = innerHeight; } });
ensureToday(); render(); initCaps();
</script>
